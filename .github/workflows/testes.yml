# Roda todos os testes a cada envio. Se algo falhar, o GitHub avisa por e-mail.
name: Testes
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Versão do app e do service worker
        run: bash testes/versao.sh
      - name: Código sem erro de sintaxe
        run: |
          node --check sw.js
          for f in scripts/*.mjs; do node --check "$f"; done
          python3 - <<'PY'
          import re,subprocess
          h=open('index.html',encoding='utf-8').read()
          js=h.split("<script>\n'use strict';",1)[1].split('</script>',1)[0]
          open('/tmp/app.js','w').write("'use strict';"+js)
          PY
          node --check /tmp/app.js
      - name: Backup (trancar, abrir, guardar)
        run: node testes/backup.test.mjs
      - name: Testes do app no Chrome
        run: bash testes/suite.sh
