<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="robots" content="noindex, nofollow">
<title>Gestão 356</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&family=Russo+One&display=swap">
<style>
/* ===== tokens · marca 356 · escuro ===== */
:root{
  --bg:#0a0a0c; --side:#0d0d11; --card:#131318; --card2:#0f0f14; --hover:#1b1b23; --track:#24242c;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.1);
  --t1:#f6f6f8; --t2:#c4c6d0; --t3:#9a9caa; --t4:#8a8c99;
  --roxo:#7b2ff7; --magenta:#b414c9; --verm:#f0164a; --lar:#ff8a1f;
  --grad:linear-gradient(120deg,#7b2ff7 0%,#b414c9 38%,#f0164a 70%,#ff8a1f 100%);
  --grad-btn:linear-gradient(120deg,#7b2ff7 0%,#b414c9 60%,#d4155a 100%);
  --grad-hero:linear-gradient(135deg,#5b1fc4 0%,#9a12b0 45%,#c8133f 100%);
  --nav-on:linear-gradient(90deg,rgba(123,47,247,.22),rgba(240,22,74,.08));
  --link:#c7a6ff; --foco:#c7a6ff;
  --ok:#3ecf8e; --warn:#ffb547; --err:#ff5c7a;
  --titulo:'Russo One',Inter,system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--t2);font:400 15px/1.5 Inter,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{color:var(--t1);font-weight:590;text-wrap:balance}
p{text-wrap:pretty}
a{color:var(--link)}
.mono{font-family:var(--mono)}
.muted{color:var(--t3)}
.hide{display:none!important}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--foco);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* logo da marca (imagem enviada pelo dono: 356 + GESTÃO) */
.logo-img{display:block;height:auto;width:112px}
.logo-img.lg{width:140px}
.logo-img.sm{width:56px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);background:#16161c;color:var(--t1);font-weight:510;font-size:14px;cursor:pointer;transition:filter .2s var(--ease),transform .2s var(--ease),background-color .2s var(--ease)}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--grad-btn);border-color:transparent;color:#fff;font-weight:590}
.btn.pri:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--t2)}
.btn.ghost:hover{background:rgba(255,255,255,.05)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;filter:none}
.btn.full{width:100%}

/* campos */
label.f{display:block;margin-bottom:16px}
label.f>span{display:block;font-size:13px;color:var(--t3);margin-bottom:8px;font-weight:510}
input,select{width:100%;height:44px;padding:0 12px;background:var(--card2);border:1px solid var(--line2);border-radius:10px;color:var(--t1)}
input:focus,select:focus{border-color:var(--foco)}
input::placeholder{color:var(--t4)}
.hint{font-size:12px;color:var(--t4);margin-top:8px}

/* aviso */
.alert{display:none;padding:12px;border-radius:10px;font-size:13px;margin-bottom:16px;border:1px solid var(--line2);background:var(--card2)}
.alert.on{display:block}
.alert.err{border-color:rgba(255,92,122,.3);background:rgba(255,92,122,.1);color:#ffb3c0}
.alert.ok{border-color:rgba(62,207,142,.3);background:rgba(62,207,142,.08);color:#9fe6c5}

/* telas cheias: login, verificar, sem acesso */
.center{min-height:100dvh;display:grid;place-items:center;padding:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px;width:100%;max-width:400px}
.brand{display:block;margin-bottom:24px}
.card h1{font-size:20px;letter-spacing:-.24px;margin-bottom:8px}
.card .sub{font-size:14px;color:var(--t3);margin-bottom:24px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;margin-bottom:24px}
.tabs button{height:36px;border:0;border-radius:8px;background:transparent;color:var(--t3);font-weight:510;font-size:13px;cursor:pointer;transition:background-color .2s var(--ease)}
.tabs button.on{background:var(--track);color:var(--t1)}
.links{display:flex;justify-content:space-between;margin-top:16px;font-size:13px}
.links button{background:none;border:0;color:var(--link);cursor:pointer;font-size:13px;min-height:44px}


.chips{display:flex;gap:8px;flex-wrap:wrap}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}
.printonly{display:none}
@media (max-width:900px){.duo{grid-template-columns:minmax(0,1fr);gap:24px}}

/* estrutura do app */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;overflow:auto;background:var(--side);border-right:1px solid var(--line);padding:24px 12px;display:flex;flex-direction:column;gap:4px}
.side .brand{padding:4px 12px 20px;margin:0;text-decoration:none}
.grp{font-size:11px;font-weight:590;letter-spacing:.6px;text-transform:uppercase;color:var(--t4);padding:16px 12px 6px}
.grp:first-of-type{padding-top:12px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;min-height:40px;padding:0 12px;border-radius:10px;color:#a3a5b2;text-decoration:none;font-size:14px;font-weight:510;transition:background-color .2s var(--ease),color .2s var(--ease)}
.nav a:hover{background:rgba(255,255,255,.04);color:var(--t1)}
.nav a.on{background:var(--nav-on);color:var(--t1)}
.nav a.on svg{color:var(--link)}
.me{margin-top:auto;border-top:1px solid var(--line);padding:16px 12px 0;display:flex;align-items:center;gap:12px}
.av{width:36px;height:36px;flex:none;border-radius:50%;background:linear-gradient(135deg,#7b2ff7,#f0164a,#ff8a1f);display:grid;place-items:center;color:#fff;font-weight:590;font-size:13px;border:0;text-decoration:none}
.me .nm{display:flex;flex-direction:column;min-width:0}
.me .nm b{color:var(--t1);font-size:14px;font-weight:510;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .nm span{font-size:12px;color:var(--t3)}
.me .btn{margin-left:auto;width:44px;padding:0}
.main{min-width:0}
.offline{background:rgba(255,181,71,.1);border-bottom:1px solid rgba(255,181,71,.3);color:var(--warn);font-size:13px;padding:8px 40px}
.wrap{max-width:1240px;padding:32px 40px 48px}
.mhead,.tabbar{display:none}

/* cabeçalho de página */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:32px}
.ph .ctx{font-size:13px;color:var(--t3);font-weight:510}
.ph h1{font-family:var(--titulo);font-weight:400;font-size:32px;letter-spacing:-.4px;margin-top:4px}
.ph p{font-size:14px;color:var(--t3);max-width:60ch;margin-top:8px}
.greet{display:none}
.mes{display:flex;align-items:center;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.mes button{width:44px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--t2);cursor:pointer;display:grid;place-items:center;transition:background-color .2s var(--ease)}
.mes button:hover:not([disabled]){background:var(--hover)}
.mes button[disabled]{opacity:.35;cursor:not-allowed}
.mes span{min-width:96px;text-align:center;font-size:14px;font-weight:510;color:var(--t1)}

/* blocos do painel */
.stack{display:flex;flex-direction:column;gap:32px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.hov{transition:background-color .22s var(--ease),transform .22s var(--ease),border-color .22s var(--ease);text-decoration:none;color:inherit}
.hov:hover{background:var(--hover);transform:translateY(-2px);border-color:rgba(185,140,255,.35)}
.kpi{display:flex;flex-direction:column;gap:12px}
.kpi .top{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--t3);font-weight:510}
.kpi .val{font-family:var(--titulo);font-size:28px;letter-spacing:-.4px;color:var(--t1);overflow-wrap:anywhere}
.kpi .sub{font-size:12px;color:var(--t3)}
.dl{font-size:12px;font-weight:590}
.dl.up{color:var(--ok)} .dl.dn{color:var(--warn)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:16px}
.sec-h h2{font-size:18px}
.sec-h a{font-size:13px;font-weight:510;text-decoration:none}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.setc{display:flex;flex-direction:column;gap:16px}
.setc .t{display:flex;align-items:center;justify-content:space-between;gap:8px}
.setc .t b{font-weight:590;color:var(--t1)}
.setc .t span{font-size:12px;color:var(--t3)}
.setc .v{font-family:var(--titulo);font-size:24px;letter-spacing:-.3px;color:var(--t1)}
.setc .l{font-size:12px;color:var(--t3)}
.meta{display:flex;flex-direction:column;gap:8px}
.meta .r{display:flex;justify-content:space-between;font-size:12px;color:var(--t3)}
.meta .r b{color:var(--t1);font-weight:510}
.trk{height:6px;border-radius:9999px;background:var(--track);overflow:hidden}
.trk div{height:100%;border-radius:9999px;background:var(--grad)}
.two>.vazio-mini{align-self:start}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:16px}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:16px}
.box h2{font-size:16px}
.box .bh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.seg{display:flex;gap:4px;padding:4px;background:var(--bg);border-radius:10px;border:1px solid var(--line)}
.seg button{height:36px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--t3);font-size:13px;font-weight:510;cursor:pointer;transition:background-color .2s var(--ease)}
.seg button.on{background:var(--track);color:var(--t1)}
.bars{height:220px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:end}
.bars .c{display:flex;flex-direction:column;gap:8px;height:100%;justify-content:flex-end}
.bars .c .n{font-size:12px;color:var(--t1);text-align:center;font-weight:510}
.bars .c .b{width:100%;border-radius:10px 10px 4px 4px;background:var(--grad);min-height:8px;transform-origin:bottom;animation:sobe .45s var(--ease) both}
.bars .c .s{font-size:12px;color:var(--t3);text-align:center}
@keyframes sobe{from{transform:scaleY(.2);opacity:0}to{transform:none;opacity:1}}
.mini{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px}
.vazio-mini{display:flex;flex-direction:column;gap:12px}
.vazio-mini p{font-size:13px;color:var(--t3)}
.eco{font-size:13px;color:var(--ok);font-weight:510}
.big{font-family:var(--titulo);font-size:28px;color:var(--t1)}

/* tabelas, painéis e vazios (equipe, diagnóstico) */
.empty{border:1px dashed var(--line2);border-radius:16px;padding:48px 24px;text-align:center;background:var(--card)}
.empty svg{width:28px;height:28px;color:var(--t4);margin-bottom:16px}
.empty h3{font-size:16px;margin-bottom:8px}
.empty p{font-size:14px;color:var(--t3);max-width:48ch;margin:0 auto}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:24px;overflow:hidden}
.panel .ph2{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px;border-bottom:1px solid var(--line)}
.panel .ph2 h3{font-size:16px}
.panel .pb{padding:16px 20px}
.scroll-x{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:510;color:var(--t3);padding:8px 20px;background:rgba(255,255,255,.02);border-bottom:1px solid var(--line);font-size:12px}
td{padding:12px 20px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:rgba(255,255,255,.02)}
.copy{display:flex;gap:8px;margin-top:8px}
.copy input{font-family:var(--mono);font-size:13px}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:9999px;font-size:11px;font-weight:590;border:1px solid var(--line2);color:var(--t3);background:rgba(255,255,255,.03)}
.badge.ind{color:var(--link);border-color:rgba(199,166,255,.3);background:rgba(123,47,247,.12)}
.badge.ok{color:var(--ok);border-color:rgba(62,207,142,.3);background:rgba(62,207,142,.08)}
.badge.err{color:#ff8fa3;border-color:rgba(255,92,122,.3);background:rgba(255,92,122,.1)}
.skel{height:12px;border-radius:4px;background:rgba(255,255,255,.05)}
.sk{display:flex;flex-direction:column;gap:12px;width:240px}
.skbox{height:120px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.lista{display:flex;flex-direction:column}
.lista a{display:flex;align-items:center;gap:12px;min-height:52px;border-top:1px solid var(--line);color:var(--t1);text-decoration:none;font-size:15px}
.lista a:first-child{border-top:0}
.lista a svg{color:var(--t3)}

/* boletos */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:36px;padding:0 14px;border-radius:9999px;border:1px solid var(--line2);background:transparent;color:#a3a5b2;font-size:13px;font-weight:510;cursor:pointer;transition:background-color .2s var(--ease)}
.chip:hover{background:rgba(255,255,255,.05)}
.chip.on{border-color:rgba(185,140,255,.5);background:rgba(139,61,255,.18);color:var(--t1)}
.rcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.rc{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:14px;background:var(--card);border:1px solid var(--line);transition:transform .22s var(--ease),border-color .22s var(--ease)}
.rc:hover{transform:translateY(-2px)}
.rc.on{border-color:rgba(185,140,255,.55)}
.rc .l{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t3);font-weight:510}
.rc .v{font-family:var(--titulo);font-size:24px;color:var(--t1);overflow-wrap:anywhere}
.rc .q{font-size:12px;color:var(--t3)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.brow{display:grid;grid-template-columns:minmax(0,2.6fr) 1.2fr 1fr .9fr auto;gap:12px;align-items:center;padding:10px 20px;border-top:1px solid var(--line);transition:background-color .18s var(--ease)}
.brow:hover{background:rgba(255,255,255,.025)}
.brow.hd{background:rgba(255,255,255,.02);color:var(--t3);font-size:12px;font-weight:510;padding:8px 20px;border-top:0}
.brow.hd:hover{background:rgba(255,255,255,.02)}
.bnome{min-width:0;display:flex;flex-direction:column}
.bnome b{color:var(--t1);font-weight:510;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bnome span,.bven span{font-size:12px;color:var(--t3)}
.bven{font-variant-numeric:tabular-nums}
.bval{text-align:right;color:var(--t1);font-weight:510;font-variant-numeric:tabular-nums}
.bact{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.ib{width:44px;height:44px;border-radius:10px;border:1px solid var(--line2);background:transparent;color:#a3a5b2;cursor:pointer;display:grid;place-items:center;position:relative;transition:background-color .2s var(--ease)}
.ib:hover{background:rgba(255,255,255,.06)}
.ib.tem::after{content:"";position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.btn.pg{background:#8b3dff;border-color:transparent;color:#fff;font-weight:590;height:44px}
.btn.bad{background:rgba(255,92,122,.1);border-color:rgba(255,92,122,.3);color:#ff8fa3}
.rc.est{cursor:default}.rc.est:hover{transform:none}
.dnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dnav .dl{font-size:15px;font-weight:510;color:var(--t1);min-width:210px;text-align:center}
.frow{display:grid;grid-template-columns:minmax(0,2fr) .9fr auto auto;gap:12px;align-items:center;padding:10px 20px;border-top:1px solid var(--line);transition:background-color .18s var(--ease)}
.frow:hover{background:rgba(255,255,255,.025)}
.frow.ina{opacity:.55}
.fval{text-align:right;color:var(--t1);font-weight:510;font-variant-numeric:tabular-nums}
.fseg{display:flex;gap:4px;padding:4px;background:var(--bg);border-radius:10px;border:1px solid var(--line)}
.fseg button{height:36px;min-width:84px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--t3);font-size:13px;font-weight:510;cursor:pointer;transition:background-color .2s var(--ease)}
.fseg button:hover{background:rgba(255,255,255,.05)}
.fseg button.on.p{background:rgba(62,207,142,.16);color:var(--ok)}
.fseg button.on.f{background:rgba(255,92,122,.14);color:#ff8fa3}
.fact{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.btn.pgok{background:rgba(62,207,142,.1);border-color:rgba(62,207,142,.3);color:var(--ok);height:44px}
.mrow{display:grid;grid-template-columns:minmax(0,1.8fr) .5fr .5fr 1fr 1fr 1fr auto;gap:12px;align-items:center;padding:10px 20px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.mrow.hd{background:rgba(255,255,255,.02);color:var(--t3);font-size:12px;font-weight:510;padding:8px 20px;border-top:0}
.mrow .mc{text-align:right;color:var(--t1)}
.mrow .mc.z{color:var(--t3)}
.mrow .fnome{min-width:0}
.fnome{min-width:0;display:flex;flex-direction:column}
.fnome b{color:var(--t1);font-weight:510;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fnome span{font-size:12px;color:var(--t3)}
.ib.q{font-size:22px;line-height:1;color:var(--t1)}
.fech{font-variant-numeric:tabular-nums}
.fr{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(0,1fr));gap:12px;align-items:center;padding:11px 20px;border-top:1px solid var(--line);font-size:14px}
.fr.hd{background:rgba(255,255,255,.02);border-top:0;padding:10px 20px;color:var(--t3);font-size:12px;font-weight:510}
.fr .fl{color:var(--t3)}.fr .fv{text-align:right;color:var(--t1)}
.fr.b .fl,.fr.b .fv{font-weight:590}.fr.eco{background:rgba(62,207,142,.06)}.fr.eco .fl{color:var(--t1)}
.tabs2{margin-bottom:0;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.badge.warn{color:var(--warn);border-color:rgba(255,176,64,.3);background:rgba(255,176,64,.08)}
.nb{margin-left:auto;font-size:11px;font-weight:590;color:#ff8fa3;background:rgba(255,92,122,.12);padding:1px 8px;border-radius:9999px}
.prox{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.prox .n{min-width:0}
.prox .n b{display:block;color:var(--t1);font-weight:400;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prox .n span{font-size:12px;color:var(--t3)}
.prox .r{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px;color:var(--t1);font-size:14px;font-weight:510}
.resumo4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.resumo4 .mini .l{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t3)}

<script>
'use strict';
/* ============ config ============ */
// A chave web do Firebase é pública por desenho; quem protege os dados são as regras do Firestore.
const FB = {

const EMPRESA = '356';
const ADMINS = ['lpacastro@hotmail.com', 'eliana_goliveira@hotmail.com']; // mesmos e-mails das regras
firebase.initializeApp(FB);
const auth = firebase.auth();
const db = firebase.firestore();
const TS = () => firebase.firestore.FieldValue.serverTimestamp();

/* ============ utilidades ============ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (s, r = document) => r.querySelector(s);
const ehAdminFixo = u => !!u && !!u.email && ADMINS.includes(u.email.toLowerCase());
function novoId() {
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
  const r = new Uint32Array(20); crypto.getRandomValues(r);
  return Array.from(r, n => abc[n % abc.length]).join('');
}
const brl = n => (Number(n) || 0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
const brlMil = n => Math.abs(n) >= 1000 ? 'R$ ' + (n / 1000).toLocaleString('pt-BR', { maximumFractionDigits:1 }) + ' mil' : brl(n);
const pct = n => (n * 100).toLocaleString('pt-BR', { maximumFractionDigits:1 }) + '%';
const pad = n => String(n).padStart(2, '0');
const mesAtual = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const mesAdd = (m, d) => { const [y, mo] = m.split('-').map(Number); const x = new Date(y, mo - 1 + d, 1); return x.getFullYear() + '-' + pad(x.getMonth() + 1); };
const mesNome = (m, longo) => { const [y, mo] = m.split('-').map(Number); const s = new Date(y, mo - 1, 1).toLocaleDateString('pt-BR', { month: longo ? 'long' : 'short', year:'numeric' }).replace('.', ''); return s.charAt(0).toUpperCase() + s.slice(1); };
const saudacao = () => { const h = new Date().getHours(); return h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite'; };

const ICON = {
  painel:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  importados:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  bebidas:'<path d="M6 3h12l-1.5 17a1 1 0 0 1-1 .9h-7a1 1 0 0 1-1-.9z"/><path d="M6.5 9h11"/>',
  cozinha:'<path d="M5 3v7a2 2 0 0 0 4 0V3M7 12v9M17 3c-2 2-3 4.5-3 7h3v11"/>',
  eventos:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  boletos:'<path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  freelancers:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 11l2 2 4-4"/>',
  relatorios:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  pessoal:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  equipe:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14a6.5 6.5 0 0 1 3.5 6"/>',
  diag:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
  sair:'<path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M16 8l4 4-4 4M20 12H9"/>',
  mais:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
  energia:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  esq:'<path d="M15 6l-6 6 6 6"/>',
  dir:'<path d="M9 6l6 6-6 6"/>',
  camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  grafico:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'
};
const ico = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[n] || ''}</svg>`;
const logo = (cls = '') => `<img class="logo-img ${cls}" src="logo-356.png" alt="356 Gestão" width="640" height="411">`;
const marca = () => `<div class="brand">${logo('lg')}</div>`;
const SETORES = [
  { id:'importados', nome:'Produtos importados' },
  { id:'bebidas',    nome:'Bebidas' },
  { id:'cozinha',    nome:'Cozinha' },
  { id:'eventos',    nome:'Eventos' }
];

/* ============ Store ============ */
const Store = {
  s: { fase:'carregando', user:null, perfil:null, rota:'painel', online:navigator.onLine,
       painel:{ mes:mesAtual(), metrica:'vendas', dados:null, chave:null, erro:null },
       boletos:{ lista:null, filtro:'abertos', erro:null },
       free:{ lista:null, pres:{}, meses:[], dia:null, erro:null },
       lanc:{ mes:mesAtual(), lista:null, chave:null, erro:null, tab:'lanc' },
       estoque:{ lista:null, erro:null },
       tar:{ lista:null, erro:null, filtro:'abertas' }, metas:{ mapa:null, erro:null }, energia:{ lista:null, mes:mesAtual(), loja:'todas', erro:null }, rel:{ mes:mesAtual(), esc:'geral', dados:null, chave:null, erro:null } },
  subs: [],
  set(p) { Object.assign(this.s, p); this.subs.forEach(f => f(this.s)); },
  on(f) { this.subs.push(f); }
};
let cadastrando = false;

/* ============ erros em português ============ */
function msgErro(e) {
  const c = (e && e.code) || '';
  const m = {
    'auth/invalid-credential':'E-mail ou senha incorretos.',
    'auth/wrong-password':'E-mail ou senha incorretos.',
    'auth/user-not-found':'E-mail ou senha incorretos.',
    'auth/invalid-email':'E-mail inválido.',
    'auth/email-already-in-use':'Esse e-mail já tem conta. Use "Entrar".',
    'auth/weak-password':'Senha fraca. Use 8 caracteres ou mais.',
    'auth/too-many-requests':'Muitas tentativas. Espere alguns minutos.',
    'auth/network-request-failed':'Sem internet. Tente de novo.',
    'auth/operation-not-allowed':'Login por e-mail e senha não está ativado no Firebase.',
    'auth/missing-password':'Digite a senha.',
    'permission-denied':'Sem permissão para isso.',
    'unavailable':'Sem conexão com o banco. Tente de novo.'
  };
  return m[c] || (e && e.message) || 'Algo deu errado.';
}

/* ============ sessão ============ */
async function iniciar(u) {
  try {
    const adm = ehAdminFixo(u);
    if (adm && !u.emailVerified) { Store.set({ user:u, perfil:null, fase:'verificar' }); return; }
    const ref = db.doc('usuarios/' + u.uid);
    let snap = await ref.get();
    if (!snap.exists && adm) {
      const empRef = db.doc('empresas/' + EMPRESA);
      const emp = await empRef.get();
      const b = db.batch();
      if (!emp.exists) b.set(empRef, { nome:'356', criadoPorUid:u.uid, criadoEm:TS() });
      b.set(ref, { papel:'admin', empresaId:EMPRESA, email:u.email, nome:u.displayName || u.email.split('@')[0], criadoEm:TS() });
      await b.commit();
      snap = await ref.get();
    }
    if (!snap.exists) { Store.set({ user:u, perfil:null, fase:'semacesso' }); return; }
    const rota = (location.hash.replace('#/', '') || 'painel');
    Store.set({ user:u, perfil:snap.data(), fase:'app', rota });
  } catch (e) {
    console.error(e);
    Store.set({ user:u, perfil:null, fase:'erro', erro:msgErro(e) });
  }
}
auth.onAuthStateChanged(u => {
  if (cadastrando) return;
  if (!u) { Store.set({ user:null, perfil:null, fase:'login' }); return; }
  iniciar(u);
});

/* ============ ações de conta ============ */
async function entrar(email, senha) { await auth.signInWithEmailAndPassword(email.trim(), senha); }

async function criarConta({ nome, email, senha, convite }) {
  email = email.trim().toLowerCase(); nome = nome.trim(); convite = convite.trim();
  const adm = ADMINS.includes(email);
  if (!nome) throw { message:'Digite seu nome.' };
  if (senha.length < 8) throw { code:'auth/weak-password' };
  if (!adm && !/^[A-Za-z0-9]{20}$/.test(convite)) throw { message:'Para criar conta você precisa de um convite válido.' };
  cadastrando = true;
  let cred = null;
  try {
    cred = await auth.createUserWithEmailAndPassword(email, senha);
    await cred.user.updateProfile({ displayName:nome });
    if (adm) {
      await cred.user.sendEmailVerification();
    } else {
      const b = db.batch();
      b.update(db.doc('convites/' + convite), { usadoPorUid:cred.user.uid, usadoEmMs:Date.now() });
      b.set(db.doc('usuarios/' + cred.user.uid), { papel:'gerente', empresaId:EMPRESA, email, nome, criadoEm:TS(), conviteId:convite });
      try { await b.commit(); }
      catch (e) { throw (e.code === 'permission-denied' || e.code === 'not-found') ? { message:'Convite inválido, já usado ou vencido. Peça um novo.' } : e; }
    }
  } catch (e) {
    if (cred && !adm) { try { await cred.user.delete(); } catch (_) {} }
    cadastrando = false;
    throw e;
  }
  cadastrando = false;
  await iniciar(auth.currentUser);
}

/* ============ diagnóstico das regras (roda com a conta de quem está logado) ============ */
function suiteDeTestes(perfil, user) {
  const adm = ehAdminFixo(user) && user.emailVerified;
  const uid = user.uid;
  const diagEmp = () => db.doc(`empresas/${EMPRESA}/_diagnostico/diag-${uid}`);
  const diagPes = () => db.doc(`pessoal/${EMPRESA}/_diagnostico/diag-${uid}`);
  const T = (nome, esperado, fn) => ({ nome, esperado, fn });
  const comum = [
    T('Empresa: gravar um registro de teste', 'permitir', () => diagEmp().set({ teste:true, em:TS() })),
    T('Empresa: ler esse registro', 'permitir', () => diagEmp().get()),
    T('Empresa: ler o cadastro da empresa', 'permitir', () => db.doc('empresas/' + EMPRESA).get()),
    T('Sistema (servidor): ler', 'negar', () => db.doc('sistema/x').get()),
    T('Sistema (servidor): gravar', 'negar', () => db.doc('sistema/x').set({ a:1 })),
    T('Trocar a própria empresa', 'negar', () => db.doc('usuarios/' + uid).update({ empresaId:'outra' })),
    T('Apagar o próprio usuário', 'negar', () => db.doc('usuarios/' + uid).delete()),
    T('Apagar a empresa', 'negar', () => db.doc('empresas/' + EMPRESA).delete())
  ];
  if (adm) {
    return comum.concat([
      T('Pessoal: gravar', 'permitir', () => diagPes().set({ teste:true, em:TS() })),
      T('Pessoal: ler', 'permitir', () => diagPes().get()),
      T('Pessoal: apagar', 'permitir', () => diagPes().delete()),
      T('Empresa: apagar o registro de teste (só admin)', 'permitir', () => diagEmp().delete()),
      T('Empresa: mudar o dono do cadastro', 'negar', () => db.doc('empresas/' + EMPRESA).update({ criadoPorUid:'x' })),
      T('Convite com validade de 9 dias', 'negar', () => db.doc('convites/' + novoId()).set({ empresaId:EMPRESA, expiraEmMs:Date.now() + 9*864e5, criadoPorUid:uid, usadoPorUid:null })),
      T('Convite normal (vence em 1 segundo)', 'permitir', () => db.doc('convites/' + novoId()).set({ empresaId:EMPRESA, expiraEmMs:Date.now() + 1000, criadoPorUid:uid, usadoPorUid:null })),
      T('Listar todos os convites', 'negar', () => db.collection('convites').get())
    ]);
  }
  return comum.concat([
    T('Pessoal: ler (gerente nunca)', 'negar', () => diagPes().get()),
    T('Pessoal: gravar (gerente nunca)', 'negar', () => diagPes().set({ x:1 })),
    T('Empresa: apagar registro (gerente nunca)', 'negar', () => diagEmp().delete()),
    T('Empresa: alterar o cadastro da empresa', 'negar', () => db.doc('empresas/' + EMPRESA).update({ nome:'x' })),
    T('Virar admin sozinho', 'negar', () => db.doc('usuarios/' + uid).update({ papel:'admin' })),
    T('Criar convite', 'negar', () => db.doc('convites/' + novoId()).set({ empresaId:EMPRESA, expiraEmMs:Date.now() + 1000, criadoPorUid:uid, usadoPorUid:null }))
  ]);
}
async function rodarTestes(suite) {
  const out = [];
  for (const t of suite) {
    let got;
    try { await t.fn(); got = 'permitir'; }
    catch (e) { got = e && e.code === 'permission-denied' ? 'negar' : 'erro:' + ((e && e.code) || (e && e.message) || '?'); }
    out.push({ nome:t.nome, esperado:t.esperado, obtido:got, ok:got === t.esperado });
  }
  return out;
}

/* ============ dados do painel (lê o que os próximos blocos vão gravar) ============ */
// Formato combinado: lancamentos {tipo:'venda'|'custo', setor, valor:número, data:'AAAA-MM-DD'}
//                    metas/{setor_AAAA-MM} {vendas}   energia/{AAAA-MM_loja} {mes, loja, consumo, injetado, semDesconto, pagoUsina, pagoEnel}
function somar(docs) {
  const t = { vendas:0, custos:0, n:0, set:{}, sem:{ vendas:[0,0,0,0], custos:[0,0,0,0] } };
  docs.forEach(d => {
    const x = d.data();
    const k = x.tipo === 'venda' ? 'vendas' : x.tipo === 'custo' ? 'custos' : null;
    if (!k) return;
    const v = Number(x.valor) || 0;
    t[k] += v; t.n++;
    const s = t.set[x.setor] || (t.set[x.setor] = { vendas:0, custos:0 });
    s[k] += v;
    const dia = parseInt(String(x.data).slice(8, 10), 10) || 1;
    t.sem[k][Math.min(3, Math.floor((dia - 1) / 7))] += v;
  });
  return t;
}

function comprimir(file) {
  return new Promise((ok, ko) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onerror = () => { URL.revokeObjectURL(url); ko(new Error('Não consegui abrir essa imagem. Use uma foto (JPG ou PNG).')); };
    im.onload = () => {
      URL.revokeObjectURL(url);
      let max = 1100, q = .72, out = '';
      for (let i = 0; i < 6; i++) {
        const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        out = c.toDataURL('image/jpeg', q);
        if (out.length < 200000) break;
        max *= .8; q -= .06;
      }
      out.length < 900000 ? ok(out) : ko(new Error('A foto ficou grande demais. Tente tirar de mais perto.'));
    };
    im.src = url;
  });
}

}

/* rotas visíveis para cada perfil. A regra do Pessoal continua sendo a do banco; aqui só some o menu. */
function rotasDoPerfil(s) {
  const adm = ehAdminFixo(s.user) && s.user.emailVerified;
  const eAdminEmp = s.perfil && s.perfil.papel === 'admin';
  const r = [{ id:'painel', nome:'Painel', ic:'painel', grp:'Empresa' }];
  SETORES.forEach(x => r.push({ id:x.id, nome:x.nome, ic:x.id, grp:'Empresa' }));
  r.push({ id:'boletos', nome:'Boletos', ic:'boletos', grp:'Controle' });
  r.push({ id:'freelancers', nome:'Freelancers', ic:'freelancers', grp:'Controle' });
  r.push({ id:'energia', nome:'Energia solar', ic:'energia', grp:'Controle' });
  r.push({ id:'relatorios', nome:'Relatórios', ic:'relatorios', grp:'Controle' });
  if (adm) r.push({ id:'pessoal', nome:'Pessoal', ic:'pessoal', grp:'Casal' });
  if (eAdminEmp) r.push({ id:'equipe', nome:'Equipe', ic:'equipe', grp:'Gestão' });
  r.push({ id:'diag', nome:'Diagnóstico', ic:'diag', grp:'Gestão' });
  return r;
}
const ROTAS_EXTRAS = { setores:'Setores', mais:'Mais' };

/* ----- painel ----- */
function delta(a, b) {
  if (!(b > 0)) return '';
  const d = a / b - 1;
  return `<span class="dl ${d >= 0 ? 'up' : 'dn'}">${d >= 0 ? '+' : '−'}${pct(Math.abs(d))}</span>`;
}
function painelHTML(s, nomeCurto) {
  const p = s.painel, d = p.dados;
  const mesLabel = mesNome(p.mes, true), mesCurto = mesNome(p.mes, false);
  const podeAvancar = p.mes < mesAtual();
  const head = `
  <div class="ph">
    <div>
      <div class="greet">${saudacao()}, ${esc(nomeCurto.split(' ')[0])} · ${esc(mesLabel.split(' ')[0].toLowerCase())}</div>
      <div class="ctx">${esc(mesLabel)} · todos os setores</div>
      <h1>Painel geral</h1>
    </div>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <div class="mes" role="group" aria-label="Mês">
      <button data-act="mes" data-d="-1" aria-label="Mês anterior">${ico('esq')}</button>
      <span aria-live="polite">${esc(mesCurto)}</span>
      <button data-act="mes" data-d="1" aria-label="Próximo mês" ${podeAvancar ? '' : 'disabled'}>${ico('dir')}</button>
    </div>
    <button class="btn pri" data-act="lancNovo">+ Novo lançamento</button></div>
  </div>`;
  if (p.erro) return head + `<div class="alert err on" role="alert">${esc(p.erro)}</div><button class="btn" data-act="recarregarPainel">Tentar de novo</button>`;
  if (!d) return head + `<div class="stack"><div class="kpis"><div class="skbox"></div><div class="skbox"></div><div class="skbox"></div><div class="skbox"></div></div><div class="skbox" style="height:220px"></div></div>`;

  const a = d.atual, b = d.anterior;
  const lucro = a.vendas - a.custos, lucroAnt = b.vendas - b.custos;
  const semDados = a.n === 0;
  const margem = a.vendas > 0 ? pct(lucro / a.vendas) : null;
  const en = d.energia;
  const eco = en ? ecoEn(en) : 0;
  const ecoPct = en ? ecoPctEn(en) : 0;
  const kpi = (cls, label, valor, dl, sub) => `<div class="box kpi hov ${cls}"><div class="top"><span>${label}</span>${dl}</div><div class="val">${valor}</div><div class="sub">${sub}</div></div>`;
  const kpis = [
    kpi('', 'Vendas', brl(a.vendas), delta(a.vendas, b.vendas), semDados ? 'Sem lançamentos neste mês' : (b.vendas > 0 ? 'vs. mês anterior (' + brl(b.vendas) + ')' : 'primeiro mês com lançamentos')),
    kpi('', 'Custos', brl(a.custos), delta(a.custos, b.custos), semDados ? 'Sem lançamentos neste mês' : 'compras, folha, freelancers, contas'),
    kpi('hero', 'Lucro', brl(lucro), lucroAnt > 0 && lucro > 0 ? delta(lucro, lucroAnt) : '', margem ? 'margem de ' + margem : 'aparece com vendas lançadas'),
    kpi('', 'Economia solar', brl(en ? eco : 0), en ? `<span class="dl up">${pct(ecoPct)}</span>` : '', en ? (Number(en.injetado) || 0).toLocaleString('pt-BR') + ' kWh injetados' : 'Sem dados de energia neste mês')
  ].join('');

  const setCards = SETORES.map(x => {
    const v = d.atual.set[x.id] || { vendas:0, custos:0 };
    const mg = v.vendas > 0 ? pct((v.vendas - v.custos) / v.vendas) : '—';
    const meta = d.metas[x.id] || 0;
    const prog = meta > 0 ? Math.min(100, Math.round(v.vendas / meta * 100)) : 0;
    return `<a class="box hov setc" href="#/${x.id}">
      <div class="t"><b>${esc(x.nome)}</b></div>
      <div><div class="v">${brl(v.vendas)}</div><div class="l">vendas no mês · margem ${mg}</div></div>
      <div class="meta"><div class="r"><span>Meta</span><b>${meta > 0 ? prog + '% de ' + brl(meta).replace(',00', '') : 'não definida'}</b></div>
        <div class="trk" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${prog}" aria-label="Meta de ${esc(x.nome)}"><div style="width:${prog}%"></div></div></div>
    </a>`;
  }).join('');

  const m = p.metrica, serie = a.sem[m], max = Math.max(...serie, 1);
  const tem = serie.some(v => v > 0);
  const grafico = tem
    ? `<div class="bars" role="img" aria-label="${m === 'vendas' ? 'Vendas' : 'Custos'} por semana: ${serie.map(brlMil).join('; ')}">${serie.map((v, i) =>
        `<div class="c"><div class="n">${v > 0 ? brlMil(v) : '—'}</div><div class="b" style="height:${Math.max(4, Math.round(v / max * 78))}%"></div><div class="s">${i === 3 ? 'Sem 4+' : 'Sem ' + (i + 1)}</div></div>`).join('')}</div>`
    : `<div class="vazio-mini"><p>Nenhum ${m === 'vendas' ? 'lançamento de venda' : 'custo lançado'} em ${esc(mesLabel.toLowerCase())}. As barras aparecem quando houver lançamentos.</p></div>`;

  const futuro = (titulo, texto) => `<div class="box vazio-mini"><div class="bh" style="margin:0"><h2>${titulo}</h2><span class="badge">Em breve</span></div><p>${texto}</p></div>`;

  return head + `
  <div class="stack">
    <section aria-label="Resumo do mês" class="kpis">${kpis}</section>
    <section aria-label="Setores">
      <div class="sec-h"><h2>Setores</h2></div>
      <div class="sets">${setCards}</div>
    </section>
    <section class="two">
      <div class="box">
        <div class="bh"><h2>${m === 'vendas' ? 'Vendas' : 'Custos'} por semana</h2>
          <div class="seg" role="group" aria-label="Métrica"><button data-act="metrica" data-m="vendas" class="${m === 'vendas' ? 'on' : ''}">Vendas</button><button data-act="metrica" data-m="custos" class="${m === 'custos' ? 'on' : ''}">Custos</button></div></div>
        ${grafico}
      </div>
      ${boletosCard(s)}
    </section>
    <section class="three">
      ${tarefasCard(s)}
      ${freelancersCard(s)}
      <div class="box vazio-mini"><div class="bh" style="margin:0"><h2>Energia solar</h2><a href="#/energia" style="font-size:13px;font-weight:510;text-decoration:none">Abrir</a></div>${en
        ? `<div><span class="big">${brl(eco)}</span> <span class="muted" style="font-size:13px">economizados no mês</span></div>
           <p>Sem desconto seria <b style="color:var(--t1)">${brl(en.semDesconto)}</b>. Pagando usina e Enel: <b style="color:var(--t1)">${brl(totEn(en))}</b>.</p>
           <div class="eco">${pct(ecoPct)} a menos que sem desconto</div>`
        : '<p>Sem dados de energia em ' + esc(mesLabel.toLowerCase()) + '. A economia com a usina aparece depois do primeiro lançamento do mês.</p>'}</div>
    </section>
  </div>`;
}

function page(id, s, nomeCurto) {
  if (id === 'painel') return painelHTML(s, nomeCurto);
  if (id === 'setores') return cab('Setores', 'Os quatro setores da 356.') + `<div class="sets">${SETORES.map(x => `
    <a class="box hov setc" href="#/${x.id}"><div class="t"><b>${ico(x.id)} ${esc(x.nome)}</b><span class="badge ind">Abrir</span></div></a>`).join('')}</div>`;
  if (id === 'mais') {
    const rotas = rotasDoPerfil(s).filter(r => ['energia','relatorios','pessoal','equipe','diag'].includes(r.id));
    return cab('Mais') + `<div class="box"><div class="lista">${rotas.map(r => `<a href="#/${r.id}">${ico(r.ic)}${esc(r.nome)}</a>`).join('')}
      <a href="#/mais" data-act="sair">${ico('sair')}Sair</a></div></div>`;
  }
  const set = SETORES.find(x => x.id === id);
  if (set) return setorHTML(s, set);
  if (id === 'boletos') return boletosHTML(s);
  if (id === 'energia') return energiaHTML(s);
  if (id === 'freelancers') return freelancersHTML(s);
  if (id === 'relatorios') return relatoriosHTML(s);
  if (id === 'pessoal') return cab('Pessoal', 'Vida pessoal do casal. <span class="badge ind">Só Luiz e Eliana</span>') +
    vazio('pessoal', 'Espaço pessoal vazio', 'O gerente não enxerga esta área, nem nos dados. Seus gastos e as entradas de aluguéis e rendas extras entram aqui.');
  if (id === 'equipe') return cab('Equipe', 'Quem tem acesso à empresa. O gerente entra por convite de uso único, válido por 7 dias.') + `
    <div class="panel"><div class="ph2"><h3>Convidar gerente</h3><button class="btn pri" data-act="convite">Gerar convite</button></div>
      <div class="pb" id="conviteBox"><p class="muted" style="font-size:14px">Gere o link e mande ao Lucas. Ele cria a conta e entra só na área da empresa.</p></div></div>
    <div class="panel"><div class="ph2"><h3>Pessoas com acesso</h3></div>
      <div id="equipeLista"><div class="pb"><div class="skel" style="width:40%"></div></div></div></div>`;
  if (id === 'diag') return cab('Diagnóstico das regras', 'Testa, com a sua conta, o que o banco permite e o que bloqueia. Cada linha mostra o esperado e o resultado real.') + `
    <div class="panel"><div class="ph2"><h3>Testes de acesso</h3><button class="btn pri" data-act="rodar" id="btnRodar">Rodar testes</button></div>
      <div id="diagOut"><div class="pb"><p class="muted" style="font-size:14px">Conta atual: <b style="color:var(--t1)">${esc(s.user.email)}</b> (${s.perfil.papel === 'admin' ? 'admin' : 'gerente'}). Os testes gravam só registros marcados como teste.</p></div></div></div>`;
  return vazio('painel', 'Página não encontrada', 'Use o menu para voltar ao painel.');
}

/* após desenhar uma página, carrega o que ela precisa */
async function aposPagina(id, s) {
  if (id === 'painel') { carregarPainel(); return; }
  if (SETORES.some(x => x.id === id)) { carregarLanc(); carregarEstoque(); carregarMetas(); return; }
  if (id === 'energia') { carregarEnergia(); return; }
  if (id === 'relatorios') { carregarRel(); return; }
  if (id === 'equipe') {
    const box = $('#equipeLista'); if (!box) return;
    try {
      const q = await db.collection('usuarios').where('empresaId', '==', EMPRESA).get();
      const lin = q.docs.map(d => d.data()).sort((a, b) => (a.nome || '').localeCompare(b.nome || ''));
      box.innerHTML = lin.length ? `<div class="scroll-x"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Papel</th></tr></thead><tbody>${lin.map(u =>
        `<tr><td style="color:var(--t1)">${esc(u.nome)}</td><td>${esc(u.email)}</td><td><span class="badge ${u.papel === 'admin' ? 'ind' : ''}">${u.papel === 'admin' ? 'Admin' : 'Gerente'}</span></td></tr>`).join('')}</tbody></table></div>`
        : '<div class="pb muted">Ninguém ainda.</div>';
    } catch (e) { box.innerHTML = `<div class="pb"><div class="alert err on">${esc(msgErro(e))}</div></div>`; }
  }
}

/* ============ render ============ */
let modoLogin = 'entrar';
let ultimaFase = null;
function render() {
  const s = Store.s, root = $('#root');
  if (s.fase === 'login') {
    const conv = new URLSearchParams(location.search).get('convite') || '';
    if (conv && ultimaFase !== 'login') modoLogin = 'criar';
    root.innerHTML = V.login(modoLogin, conv);
  }
  else if (s.fase === 'verificar') root.innerHTML = V.verificar(s);
  else if (s.fase === 'semacesso') root.innerHTML = V.semacesso(s);
  else if (s.fase === 'erro') root.innerHTML = V.erro(s);
  else if (s.fase === 'app') {
    const y = window.scrollY;
    root.innerHTML = V.app(s);
    if (ultimaFase === 'app') window.scrollTo(0, y);
    const rotas = rotasDoPerfil(s);
    const id = rotas.some(r => r.id === s.rota) || ROTAS_EXTRAS[s.rota] ? s.rota : 'painel';
    aposPagina(id, s);
    if (s.boletos.lista === null) carregarBoletos();
    if (s.free.lista === null) carregarFree();
    if (s.tar.lista === null) carregarTar();
  }
  ultimaFase = s.fase;
}
Store.on(render);

window.addEventListener('hashchange', () => {
  if (Store.s.fase !== 'app') return;
  window.scrollTo(0, 0);
  Store.set({ rota: location.hash.replace('#/', '') || 'painel', painel:{ ...Store.s.painel, chave:null } }); // volta ao painel = dados frescos
});
window.addEventListener('online', () => Store.set({ online:true }));
window.addEventListener('offline', () => Store.set({ online:false }));

/* ============ eventos ============ */
function aviso(msg, tipo = 'err') {
  const a = $('#aviso'); if (!a) return;
  a.className = 'alert on ' + tipo; a.textContent = msg;
}
const acoes = {
  modo(el) { modoLogin = el.dataset.modo; render(); },
  async esqueci() {
    const email = ($('input[name=email]') || {}).value || '';
    if (!email.trim()) return aviso('Digite seu e-mail e clique de novo em "Esqueci a senha".');
    try { await auth.sendPasswordResetEmail(email.trim()); aviso('Se o e-mail existir, enviamos o link para criar nova senha.', 'ok'); }
    catch (e) { aviso(msgErro(e)); }
  },
  async sair() { await auth.signOut(); location.hash = ''; },
  recarregar() { if (auth.currentUser) iniciar(auth.currentUser); else Store.set({ fase:'login' }); },
  mes(el) {
    const p = Store.s.painel, novo = mesAdd(p.mes, Number(el.dataset.d));
    if (novo > mesAtual()) return;
    Store.set({ painel:{ ...p, mes:novo, dados:null, chave:null, erro:null } });
  },
  metrica(el) { Store.set({ painel:{ ...Store.s.painel, metrica:el.dataset.m } }); },
  recarregarPainel() { Store.set({ painel:{ ...Store.s.painel, dados:null, chave:null, erro:null } }); },
  boletoNovo() { abrirModal('Novo boleto', formBoleto(null)); },
  boletoEditar(el) { const b = Store.s.boletos.lista.find(x => x.id === el.dataset.id); if (b) abrirModal('Editar boleto', formBoleto(b)); },
  fecharModal() { fecharModal(); },
  filtroBoleto(el) { Store.set({ boletos:{ ...Store.s.boletos, filtro:el.dataset.f } }); },
  boletosRecarregar() { Store.set({ boletos:{ ...Store.s.boletos, lista:null, erro:null } }); },
  async pagar(el) {
    const B = Store.s.boletos, id = el.dataset.id, b = B.lista.find(x => x.id === id); if (!b) return;
    const pago = !b.pago, mud = { pago, pagoEm: pago ? hojeStr() : null };
    Store.set({ boletos:{ ...B, erro:null, lista:B.lista.map(x => x.id === id ? { ...x, ...mud } : x) } });
    try { await colBoletos().doc(id).update(mud); }
    catch (e) { Store.set({ boletos:{ ...Store.s.boletos, erro:'Não foi possível salvar. O boleto voltou ao estado anterior. ' + msgErro(e), lista:Store.s.boletos.lista.map(x => x.id === id ? b : x) } }); }
  },
  async comprovante(el) {
    const id = el.dataset.id, b = Store.s.boletos.lista.find(x => x.id === id); if (!b) return;
    comprovanteAlvo = id;

  const g = n => parseValor(f.querySelector('[name=' + n + ']').value), sd = g('semDesconto'), pu = g('pagoUsina'), pe = g('pagoEnel');

  box.textContent = (sd > 0 && pu >= 0 && pe >= 0) ? prevEnergia({ semDesconto:sd, pagoUsina:pu, pagoEnel:pe }) : 'Total e economia aparecem aqui conforme você digita.';
});
document.addEventListener('change', e => { if (e.target.id === 'arq' && e.target.files[0]) enviarComprovante(e.target.files[0]); });

/* ============ service worker (offline do "esqueleto") ============ */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
