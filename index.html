<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090a">
<meta name="robots" content="noindex, nofollow">
<title>Gestão 356</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter/index.css">
<style>
/* ===== tokens · dark · uma cor cromática (índigo) · motion zero ===== */
:root{
  --bg:#08090a; --s1:#0f1011; --s2:#191a1b; --s3:#28282c;
  --t1:#f7f8f8; --t2:#d0d6e0; --t3:#8a8f98; --t4:#62666d;
  --ind:#5e6ad2; --ind2:#7170ff; --ind3:#828fff;
  --b1:rgba(255,255,255,.05); --b2:rgba(255,255,255,.08);
  --ok:#4cb782; --warn:#f2994a; --err:#e5484d;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--t2);font:400 15px/1.5 'Inter Variable',Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-feature-settings:'cv01','ss03';-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{color:var(--t1);font-weight:590;text-wrap:balance}
p{text-wrap:pretty}
a{color:var(--ind3)}
.mono{font-family:var(--mono)}
.muted{color:var(--t3)} .dim{color:var(--t4)}
.hide{display:none!important}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:8px;border:1px solid var(--b2);background:rgba(255,255,255,.05);color:var(--t1);font-weight:510;font-size:13px;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.08)}
.btn:focus-visible,.nav a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ind2);outline-offset:1px}
.btn.pri{background:var(--ind);border-color:var(--ind2)}
.btn.pri:hover{background:var(--ind2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--t2)}
.btn.ghost:hover{background:rgba(255,255,255,.04)}
.btn.bad{background:rgba(229,72,77,.1);border-color:rgba(229,72,77,.3);color:var(--err)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.full{width:100%;height:40px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* campos */
label.f{display:block;margin-bottom:16px}
label.f>span{display:block;font-size:13px;color:var(--t3);margin-bottom:8px;font-weight:510}
input,select{width:100%;height:40px;padding:0 12px;background:var(--s1);border:1px solid var(--b2);border-radius:8px;color:var(--t1)}
input:focus,select:focus{border-color:var(--ind2)}
input::placeholder{color:var(--t4)}
.hint{font-size:11px;color:var(--t4);margin-top:8px}

/* aviso */
.alert{display:none;padding:12px;border-radius:8px;font-size:13px;margin-bottom:16px;border:1px solid var(--b2);background:var(--s1)}
.alert.on{display:block}
.alert.err{border-color:rgba(229,72,77,.3);background:rgba(229,72,77,.1);color:#f1a1a4}
.alert.ok{border-color:rgba(76,183,130,.3);background:rgba(76,183,130,.08);color:#9fdcbc}

/* tela cheia (login/verificar/sem acesso) */
.center{min-height:100dvh;display:grid;place-items:center;padding:24px}
.card{background:var(--s1);border:1px solid var(--b2);border-radius:12px;padding:32px;width:100%;max-width:400px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.logo{width:36px;height:36px;border-radius:8px;background:var(--ind);border:1px solid var(--ind2);display:grid;place-items:center;color:var(--t1);font-weight:590;font-size:13px;letter-spacing:-.165px}
.card h1{font-size:20px;letter-spacing:-.24px;margin-bottom:8px}
.card .sub{font-size:13px;color:var(--t3);margin-bottom:24px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--bg);border:1px solid var(--b1);border-radius:8px;margin-bottom:24px}
.tabs button{height:32px;border:0;border-radius:6px;background:transparent;color:var(--t3);font-weight:510;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--s3);color:var(--t1)}
.links{display:flex;justify-content:space-between;margin-top:16px;font-size:13px}
.links button{background:none;border:0;color:var(--ind3);cursor:pointer;font-size:13px}

/* app */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;border-right:1px solid var(--b1);background:var(--bg);display:flex;flex-direction:column;padding:16px 8px}
.side .brand{padding:0 8px;margin-bottom:24px}
.side .brand b{color:var(--t1);font-weight:590;font-size:15px;letter-spacing:-.165px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav .grp{font-size:11px;color:var(--t4);padding:16px 8px 8px;font-weight:510;text-transform:uppercase;letter-spacing:.6px}
.nav a{display:flex;align-items:center;gap:12px;height:36px;padding:0 8px;border-radius:6px;color:var(--t3);text-decoration:none;font-size:13px;font-weight:510}
.nav a:hover{background:rgba(255,255,255,.04);color:var(--t2)}
.nav a.on{background:rgba(255,255,255,.06);color:var(--t1)}
.nav a.on svg{color:var(--ind3)}
.me{border-top:1px solid var(--b1);padding:16px 8px 0;font-size:13px}
.me .em{color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.main{min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 32px;border-bottom:1px solid var(--b1)}
.top h2{font-size:15px;letter-spacing:-.165px}
.wrap{max-width:1200px;padding:32px}
.page-h{margin-bottom:32px}
.page-h h1{font-size:24px;letter-spacing:-.3px;margin-bottom:8px}
.page-h p{font-size:13px;color:var(--t3);max-width:60ch}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.tile{background:var(--s1);border:1px solid var(--b2);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:16px;text-decoration:none;color:inherit}
.tile:hover{background:var(--s2)}
.tile .h{display:flex;align-items:center;justify-content:space-between;color:var(--t1);font-weight:590;font-size:15px}
.tile .h span{display:flex;align-items:center;gap:8px}
.tile .h svg{color:var(--ind3)}
.tile .v{font-family:var(--mono);font-size:20px;color:var(--t4);letter-spacing:-.24px}
.tile .l{font-size:11px;color:var(--t4)}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:9999px;font-size:11px;font-weight:510;border:1px solid var(--b2);color:var(--t3);background:rgba(255,255,255,.03)}
.badge.ind{color:var(--ind3);border-color:rgba(113,112,255,.3);background:rgba(94,106,210,.1)}
.badge.ok{color:var(--ok);border-color:rgba(76,183,130,.3);background:rgba(76,183,130,.08)}
.badge.err{color:var(--err);border-color:rgba(229,72,77,.3);background:rgba(229,72,77,.08)}
.badge.warn{color:var(--warn);border-color:rgba(242,153,74,.3);background:rgba(242,153,74,.08)}
.empty{border:1px dashed var(--b2);border-radius:12px;padding:48px 24px;text-align:center;background:var(--s1)}
.empty svg{width:28px;height:28px;color:var(--t4);margin-bottom:16px}
.empty h3{font-size:15px;margin-bottom:8px}
.empty p{font-size:13px;color:var(--t3);max-width:48ch;margin:0 auto}
.panel{background:var(--s1);border:1px solid var(--b2);border-radius:8px;margin-bottom:24px}
.panel .ph{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px;border-bottom:1px solid var(--b1)}
.panel .ph h3{font-size:15px}
.panel .pb{padding:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:510;color:var(--t3);padding:8px 16px;background:rgba(255,255,255,.02);border-bottom:1px solid var(--b1);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
td{padding:12px 16px;border-bottom:1px solid var(--b1);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:rgba(255,255,255,.02)}
.copy{display:flex;gap:8px;margin-top:8px}
.copy input{font-family:var(--mono);font-size:13px}
.offline{background:rgba(242,153,74,.1);border-bottom:1px solid rgba(242,153,74,.3);color:var(--warn);font-size:13px;padding:8px 32px}
.skel{height:12px;border-radius:4px;background:rgba(255,255,255,.04)}
.sk{display:flex;flex-direction:column;gap:12px;width:240px}

@media (max-width:900px){
  .app{grid-template-columns:56px 1fr}
  .side{padding:16px 4px}
  .side .brand b,.nav a span,.nav .grp,.me .em,.me .badge{display:none}
  .side .brand{padding:0;justify-content:center}
  .nav a{justify-content:center;padding:0}
  .me .row{justify-content:center}
  .top,.wrap,.offline{padding-left:16px;padding-right:16px}
  .wrap{padding-top:24px;padding-bottom:24px}
}
</style>
</head>
<body>
<div id="root"><div class="center"><div class="sk"><div class="skel" style="width:60%"></div><div class="skel"></div><div class="skel" style="width:80%"></div></div></div></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
'use strict';
/* ============ config ============ */
// A chave web do Firebase é pública por desenho; quem protege os dados são as regras do Firestore.
const FB = {
  apiKey: "AIzaSyDkfMH9cVVtVgR9iJWSdd_X9PPEcfB3Ztc",
  authDomain: "gestao-356.firebaseapp.com",
  projectId: "gestao-356",
  storageBucket: "gestao-356.firebasestorage.app",
  messagingSenderId: "996740133409",
  appId: "1:996740133409:web:397cba876066d8082be960"
};
const EMPRESA = '356';
const ADMINS = ['lpacastro@hotmail.com', 'eliana_goliveira@hotmail.com']; // mesmos e-mails das regras
firebase.initializeApp(FB);
const auth = firebase.auth();
const db = firebase.firestore();
const TS = () => firebase.firestore.FieldValue.serverTimestamp();

/* ============ utilidades ============ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (s, r = document) => r.querySelector(s);
const ehAdminFixo = u => !!u && !!u.email && ADMINS.includes(u.email.toLowerCase());
function novoId() {
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
  const r = new Uint32Array(20); crypto.getRandomValues(r);
  return Array.from(r, n => abc[n % abc.length]).join('');
}
const ICON = {
  painel:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  importados:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  bebidas:'<path d="M6 3h12l-1.5 17a1 1 0 0 1-1 .9h-7a1 1 0 0 1-1-.9z"/><path d="M6.5 9h11"/>',
  cozinha:'<path d="M5 3v7a2 2 0 0 0 4 0V3M7 12v9M17 3c-2 2-3 4.5-3 7h3v11"/>',
  eventos:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  pessoal:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  equipe:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14a6.5 6.5 0 0 1 3.5 6"/>',
  diag:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
  sair:'<path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M16 8l4 4-4 4M20 12H9"/>'
};
const ico = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const SETORES = [
  { id:'importados', nome:'Produtos importados' },
  { id:'bebidas',    nome:'Bebidas' },
  { id:'cozinha',    nome:'Cozinha' },
  { id:'eventos',    nome:'Eventos' }
];

/* ============ Store ============ */
const Store = {
  s: { fase:'carregando', user:null, perfil:null, rota:'painel', online:navigator.onLine },
  subs: [],
  set(p) { Object.assign(this.s, p); this.subs.forEach(f => f(this.s)); },
  on(f) { this.subs.push(f); }
};
let cadastrando = false;

/* ============ erros em português ============ */
function msgErro(e) {
  const c = (e && e.code) || '';
  const m = {
    'auth/invalid-credential':'E-mail ou senha incorretos.',
    'auth/wrong-password':'E-mail ou senha incorretos.',
    'auth/user-not-found':'E-mail ou senha incorretos.',
    'auth/invalid-email':'E-mail inválido.',
    'auth/email-already-in-use':'Esse e-mail já tem conta. Use "Entrar".',
    'auth/weak-password':'Senha fraca. Use 8 caracteres ou mais.',
    'auth/too-many-requests':'Muitas tentativas. Espere alguns minutos.',
    'auth/network-request-failed':'Sem internet. Tente de novo.',
    'auth/operation-not-allowed':'Login por e-mail e senha não está ativado no Firebase.',
    'auth/missing-password':'Digite a senha.',
    'permission-denied':'Sem permissão para isso.'
  };
  return m[c] || (e && e.message) || 'Algo deu errado.';
}

/* ============ sessão ============ */
async function iniciar(u) {
  try {
    const adm = ehAdminFixo(u);
    if (adm && !u.emailVerified) { Store.set({ user:u, perfil:null, fase:'verificar' }); return; }
    const ref = db.doc('usuarios/' + u.uid);
    let snap = await ref.get();
    if (!snap.exists && adm) {
      const empRef = db.doc('empresas/' + EMPRESA);
      const emp = await empRef.get();
      const b = db.batch();
      if (!emp.exists) b.set(empRef, { nome:'356', criadoPorUid:u.uid, criadoEm:TS() });
      b.set(ref, { papel:'admin', empresaId:EMPRESA, email:u.email, nome:u.displayName || u.email.split('@')[0], criadoEm:TS() });
      await b.commit();
      snap = await ref.get();
    }
    if (!snap.exists) { Store.set({ user:u, perfil:null, fase:'semacesso' }); return; }
    const rota = (location.hash.replace('#/', '') || 'painel');
    Store.set({ user:u, perfil:snap.data(), fase:'app', rota });
  } catch (e) {
    console.error(e);
    Store.set({ user:u, perfil:null, fase:'erro', erro:msgErro(e) });
  }
}
auth.onAuthStateChanged(u => {
  if (cadastrando) return;
  if (!u) { Store.set({ user:null, perfil:null, fase:'login' }); return; }
  iniciar(u);
});

/* ============ ações de conta ============ */
async function entrar(email, senha) { await auth.signInWithEmailAndPassword(email.trim(), senha); }

async function criarConta({ nome, email, senha, convite }) {
  email = email.trim().toLowerCase(); nome = nome.trim(); convite = convite.trim();
  const adm = ADMINS.includes(email);
  if (!nome) throw { message:'Digite seu nome.' };
  if (senha.length < 8) throw { code:'auth/weak-password' };
  if (!adm && !/^[A-Za-z0-9]{20}$/.test(convite)) throw { message:'Para criar conta você precisa de um convite válido.' };
  cadastrando = true;
  let cred = null;
  try {
    cred = await auth.createUserWithEmailAndPassword(email, senha);
    await cred.user.updateProfile({ displayName:nome });
    if (adm) {
      await cred.user.sendEmailVerification();
    } else {
      const b = db.batch();
      b.update(db.doc('convites/' + convite), { usadoPorUid:cred.user.uid, usadoEmMs:Date.now() });
      b.set(db.doc('usuarios/' + cred.user.uid), { papel:'gerente', empresaId:EMPRESA, email, nome, criadoEm:TS(), conviteId:convite });
      try { await b.commit(); }
      catch (e) { throw (e.code === 'permission-denied' || e.code === 'not-found') ? { message:'Convite inválido, já usado ou vencido. Peça um novo.' } : e; }
    }
  } catch (e) {
    if (cred && !adm) { try { await cred.user.delete(); } catch (_) {} }
    cadastrando = false;
    throw e;
  }
  cadastrando = false;
  await iniciar(auth.currentUser);
}

/* ============ diagnóstico das regras (roda com a conta de quem está logado) ============ */
function suiteDeTestes(perfil, user) {
  const adm = ehAdminFixo(user) && user.emailVerified;
  const uid = user.uid;
  const diagEmp = () => db.doc(`empresas/${EMPRESA}/_diagnostico/diag-${uid}`);
  const diagPes = () => db.doc(`pessoal/${EMPRESA}/_diagnostico/diag-${uid}`);
  const T = (nome, esperado, fn) => ({ nome, esperado, fn });
  const comum = [
    T('Empresa: gravar um registro de teste', 'permitir', () => diagEmp().set({ teste:true, em:TS() })),
    T('Empresa: ler esse registro', 'permitir', () => diagEmp().get()),
    T('Empresa: ler o cadastro da empresa', 'permitir', () => db.doc('empresas/' + EMPRESA).get()),
    T('Sistema (servidor): ler', 'negar', () => db.doc('sistema/x').get()),
    T('Sistema (servidor): gravar', 'negar', () => db.doc('sistema/x').set({ a:1 })),
    T('Trocar a própria empresa', 'negar', () => db.doc('usuarios/' + uid).update({ empresaId:'outra' })),
    T('Apagar o próprio usuário', 'negar', () => db.doc('usuarios/' + uid).delete()),
    T('Apagar a empresa', 'negar', () => db.doc('empresas/' + EMPRESA).delete())
  ];
  if (adm) {
    return comum.concat([
      T('Pessoal: gravar', 'permitir', () => diagPes().set({ teste:true, em:TS() })),
      T('Pessoal: ler', 'permitir', () => diagPes().get()),
      T('Pessoal: apagar', 'permitir', () => diagPes().delete()),
      T('Empresa: apagar o registro de teste (só admin)', 'permitir', () => diagEmp().delete()),
      T('Empresa: mudar o dono do cadastro', 'negar', () => db.doc('empresas/' + EMPRESA).update({ criadoPorUid:'x' })),
      T('Convite com validade de 9 dias', 'negar', () => db.doc('convites/' + novoId()).set({ empresaId:EMPRESA, expiraEmMs:Date.now() + 9*864e5, criadoPorUid:uid, usadoPorUid:null })),
      T('Convite normal (vence em 1 segundo)', 'permitir', () => db.doc('convites/' + novoId()).set({ empresaId:EMPRESA, expiraEmMs:Date.now() + 1000, criadoPorUid:uid, usadoPorUid:null })),
      T('Listar todos os convites', 'negar', () => db.collection('convites').get())
    ]);
  }
  return comum.concat([
    T('Pessoal: ler (gerente nunca)', 'negar', () => diagPes().get()),
    T('Pessoal: gravar (gerente nunca)', 'negar', () => diagPes().set({ x:1 })),
    T('Empresa: apagar registro (gerente nunca)', 'negar', () => diagEmp().delete()),
    T('Empresa: alterar o cadastro da empresa', 'negar', () => db.doc('empresas/' + EMPRESA).update({ nome:'x' })),
    T('Virar admin sozinho', 'negar', () => db.doc('usuarios/' + uid).update({ papel:'admin' })),
    T('Criar convite', 'negar', () => db.doc('convites/' + novoId()).set({ empresaId:EMPRESA, expiraEmMs:Date.now() + 1000, criadoPorUid:uid, usadoPorUid:null }))
  ]);
}
async function rodarTestes(suite) {
  const out = [];
  for (const t of suite) {
    let got;
    try { await t.fn(); got = 'permitir'; }
    catch (e) { got = e && e.code === 'permission-denied' ? 'negar' : 'erro:' + ((e && e.code) || (e && e.message) || '?'); }
    out.push({ nome:t.nome, esperado:t.esperado, obtido:got, ok:got === t.esperado });
  }
  return out;
}

/* ============ views ============ */
const V = {};

V.login = (modo = 'entrar', convite = '') => `
<div class="center"><div class="card">
  <div class="brand"><div class="logo">356</div><b style="color:var(--t1);font-weight:590">Gestão 356</b></div>
  <h1>${modo === 'entrar' ? 'Entrar' : 'Criar conta'}</h1>
  <p class="sub">${modo === 'entrar' ? 'Acesse com seu e-mail e senha.' : 'Luiz e Eliana criam direto. A equipe precisa de um convite.'}</p>
  <div class="tabs" role="tablist">
    <button type="button" data-act="modo" data-modo="entrar" class="${modo === 'entrar' ? 'on' : ''}">Entrar</button>
    <button type="button" data-act="modo" data-modo="criar" class="${modo === 'criar' ? 'on' : ''}">Criar conta</button>
  </div>
  <div id="aviso" class="alert" role="alert"></div>
  <form data-form="${modo}" novalidate>
    ${modo === 'criar' ? `<label class="f"><span>Nome</span><input name="nome" autocomplete="name" required></label>` : ''}
    <label class="f"><span>E-mail</span><input name="email" type="email" autocomplete="email" inputmode="email" required></label>
    <label class="f"><span>Senha</span><input name="senha" type="password" autocomplete="${modo === 'entrar' ? 'current-password' : 'new-password'}" minlength="8" required>
      ${modo === 'criar' ? '<div class="hint">Mínimo de 8 caracteres.</div>' : ''}</label>
    ${modo === 'criar' ? `<label class="f"><span>Código do convite</span><input name="convite" class="mono" value="${esc(convite)}" autocomplete="off" spellcheck="false" placeholder="só para a equipe"></label>` : ''}
    <button class="btn pri full" type="submit">${modo === 'entrar' ? 'Entrar' : 'Criar conta'}</button>
  </form>
  ${modo === 'entrar' ? '<div class="links"><button type="button" data-act="esqueci">Esqueci a senha</button></div>' : ''}
</div></div>`;

V.verificar = s => `
<div class="center"><div class="card">
  <div class="brand"><div class="logo">356</div><b style="color:var(--t1);font-weight:590">Gestão 356</b></div>
  <h1>Confirme seu e-mail</h1>
  <p class="sub">Enviamos um link para <b style="color:var(--t1)">${esc(s.user.email)}</b>. Abra o e-mail, clique no link e volte aqui. Olhe também o spam.</p>
  <div id="aviso" class="alert" role="alert"></div>
  <div style="display:flex;flex-direction:column;gap:8px">
    <button class="btn pri full" data-act="jaVerifiquei">Já confirmei</button>
    <button class="btn full" data-act="reenviar">Reenviar e-mail</button>
    <button class="btn ghost full" data-act="sair">Sair</button>
  </div>
</div></div>`;

V.semacesso = s => `
<div class="center"><div class="card">
  <div class="brand"><div class="logo">356</div><b style="color:var(--t1);font-weight:590">Gestão 356</b></div>
  <h1>Sem acesso</h1>
  <p class="sub">A conta <b style="color:var(--t1)">${esc(s.user.email)}</b> ainda não faz parte da equipe. Peça um convite ao Luiz ou à Eliana.</p>
  <button class="btn full" data-act="sair">Sair</button>
</div></div>`;

V.erro = s => `
<div class="center"><div class="card">
  <h1>Não foi possível abrir</h1>
  <p class="sub">${esc(s.erro)}</p>
  <div style="display:flex;flex-direction:column;gap:8px">
    <button class="btn pri full" data-act="recarregar">Tentar de novo</button>
    <button class="btn ghost full" data-act="sair">Sair</button>
  </div>
</div></div>`;

function rotasDoPerfil(s) {
  const adm = ehAdminFixo(s.user) && s.user.emailVerified;
  const eAdminEmp = s.perfil && s.perfil.papel === 'admin';
  const r = [{ id:'painel', nome:'Painel', ic:'painel', grp:'Empresa' }];
  SETORES.forEach(x => r.push({ id:x.id, nome:x.nome, ic:x.id, grp:'Empresa' }));
  if (adm) r.push({ id:'pessoal', nome:'Pessoal', ic:'pessoal', grp:'Casal' });
  if (eAdminEmp) r.push({ id:'equipe', nome:'Equipe', ic:'equipe', grp:'Gestão' });
  r.push({ id:'diag', nome:'Diagnóstico', ic:'diag', grp:'Gestão' });
  return r;
}

V.app = s => {
  const rotas = rotasDoPerfil(s);
  let atual = rotas.find(r => r.id === s.rota) || rotas[0];
  let nav = '', g = '';
  rotas.forEach(r => {
    if (r.grp !== g) { g = r.grp; nav += `<div class="grp">${esc(g)}</div>`; }
    nav += `<a href="#/${r.id}" class="${r.id === atual.id ? 'on' : ''}" ${r.id === atual.id ? 'aria-current="page"' : ''} title="${esc(r.nome)}">${ico(r.ic)}<span>${esc(r.nome)}</span></a>`;
  });
  const papel = s.perfil.papel === 'admin' ? 'Admin' : 'Gerente';
  return `
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">356</div><b>Gestão 356</b></div>
    <nav class="nav" aria-label="Principal">${nav}</nav>
    <div class="me">
      <div class="em" title="${esc(s.user.email)}">${esc(s.perfil.nome || s.user.email)}</div>
      <div class="row"><span class="badge ${s.perfil.papel === 'admin' ? 'ind' : ''}">${papel}</span>
        <button class="btn ghost" data-act="sair" title="Sair" aria-label="Sair" style="padding:0 8px;height:32px">${ico('sair')}</button></div>
    </div>
  </aside>
  <div class="main">
    ${s.online ? '' : '<div class="offline">Sem internet. O que você vê pode estar desatualizado.</div>'}
    <div class="top"><h2>${esc(atual.nome)}</h2><span class="muted" style="font-size:13px">${esc(s.user.email)}</span></div>
    <div class="wrap" id="page">${page(atual.id, s)}</div>
  </div>
</div>`;
};

function vazio(ic, titulo, texto) {
  return `<div class="empty">${ico(ic)}<h3>${esc(titulo)}</h3><p>${esc(texto)}</p></div>`;
}
function page(id, s) {
  if (id === 'painel') return `
    <div class="page-h"><h1>Painel</h1><p>Visão geral da 356. Os valores aparecem aqui quando os lançamentos de cada setor começarem.</p></div>
    <div class="grid">${SETORES.map(x => `
      <a class="tile" href="#/${x.id}">
        <div class="h"><span>${ico(x.id)}${esc(x.nome)}</span><span class="badge">Em definição</span></div>
        <div><div class="v">—</div><div class="l">Sem lançamentos ainda</div></div>
      </a>`).join('')}</div>`;
  const set = SETORES.find(x => x.id === id);
  if (set) return `
    <div class="page-h"><h1>${esc(set.nome)}</h1><p>Setor da empresa. Visível para Luiz, Eliana e gerente.</p></div>
    ${vazio(set.id, 'Nada por aqui ainda', 'Falta definir o que este setor controla (estoque, vendas, custos, metas). Assim que definirmos, as telas entram neste espaço.')}`;
  if (id === 'pessoal') return `
    <div class="page-h"><h1>Pessoal</h1><p>Vida pessoal do casal. <span class="badge ind">Só Luiz e Eliana</span></p></div>
    ${vazio('pessoal', 'Espaço pessoal vazio', 'O gerente não enxerga esta área, nem nos dados. As telas entram aqui quando definirmos o que controlar.')}`;
  if (id === 'equipe') return `
    <div class="page-h"><h1>Equipe</h1><p>Quem tem acesso à empresa. O gerente entra por convite de uso único, válido por 7 dias.</p></div>
    <div class="panel"><div class="ph"><h3>Convidar gerente</h3><button class="btn pri" data-act="convite">Gerar convite</button></div>
      <div class="pb" id="conviteBox"><p class="muted" style="font-size:13px">Gere o link e mande ao Lucas. Ele cria a conta e entra só na área da empresa.</p></div></div>
    <div class="panel"><div class="ph"><h3>Pessoas com acesso</h3></div>
      <div id="equipeLista"><div class="pb"><div class="skel" style="width:40%"></div></div></div></div>`;
  if (id === 'diag') return `
    <div class="page-h"><h1>Diagnóstico das regras</h1><p>Testa, com a sua conta, o que o banco permite e o que bloqueia. Cada linha mostra o esperado e o resultado real.</p></div>
    <div class="panel"><div class="ph"><h3>Testes de acesso</h3><button class="btn pri" data-act="rodar" id="btnRodar">Rodar testes</button></div>
      <div id="diagOut"><div class="pb"><p class="muted" style="font-size:13px">Conta atual: <b style="color:var(--t1)">${esc(s.user.email)}</b> (${s.perfil.papel === 'admin' ? 'admin' : 'gerente'}). Os testes gravam só registros marcados como teste.</p></div></div></div>`;
  return vazio('painel', 'Página não encontrada', 'Use o menu à esquerda.');
}

/* após desenhar uma página, carrega o que ela precisa */
async function aposPagina(id, s) {
  if (id === 'equipe') {
    const box = $('#equipeLista'); if (!box) return;
    try {
      const q = await db.collection('usuarios').where('empresaId', '==', EMPRESA).get();
      const lin = q.docs.map(d => d.data()).sort((a, b) => (a.nome || '').localeCompare(b.nome || ''));
      box.innerHTML = lin.length ? `<table><thead><tr><th>Nome</th><th>E-mail</th><th>Papel</th></tr></thead><tbody>${lin.map(u =>
        `<tr><td style="color:var(--t1)">${esc(u.nome)}</td><td>${esc(u.email)}</td><td><span class="badge ${u.papel === 'admin' ? 'ind' : ''}">${u.papel === 'admin' ? 'Admin' : 'Gerente'}</span></td></tr>`).join('')}</tbody></table>`
        : '<div class="pb muted">Ninguém ainda.</div>';
    } catch (e) { box.innerHTML = `<div class="pb"><div class="alert err on">${esc(msgErro(e))}</div></div>`; }
  }
}

/* ============ render ============ */
let modoLogin = 'entrar';
let ultimaFase = null, ultimaRota = null;
function render() {
  const s = Store.s, root = $('#root');
  if (s.fase === 'login') {
    const conv = new URLSearchParams(location.search).get('convite') || '';
    if (conv && ultimaFase !== 'login') modoLogin = 'criar';
    root.innerHTML = V.login(modoLogin, conv);
  }
  else if (s.fase === 'verificar') root.innerHTML = V.verificar(s);
  else if (s.fase === 'semacesso') root.innerHTML = V.semacesso(s);
  else if (s.fase === 'erro') root.innerHTML = V.erro(s);
  else if (s.fase === 'app') {
    root.innerHTML = V.app(s);
    const rotas = rotasDoPerfil(s);
    const atual = (rotas.find(r => r.id === s.rota) || rotas[0]).id;
    aposPagina(atual, s);
  }
  ultimaFase = s.fase;
}
Store.on(render);

window.addEventListener('hashchange', () => {
  if (Store.s.fase === 'app') Store.set({ rota: location.hash.replace('#/', '') || 'painel' });
});
window.addEventListener('online', () => Store.set({ online:true }));
window.addEventListener('offline', () => Store.set({ online:false }));

/* ============ eventos ============ */
function aviso(msg, tipo = 'err') {
  const a = $('#aviso'); if (!a) return;
  a.className = 'alert on ' + tipo; a.textContent = msg;
}
const acoes = {
  modo(el) { modoLogin = el.dataset.modo; render(); },
  async esqueci() {
    const email = ($('input[name=email]') || {}).value || '';
    if (!email.trim()) return aviso('Digite seu e-mail e clique de novo em "Esqueci a senha".');
    try { await auth.sendPasswordResetEmail(email.trim()); aviso('Se o e-mail existir, enviamos o link para criar nova senha.', 'ok'); }
    catch (e) { aviso(msgErro(e)); }
  },
  async sair() { await auth.signOut(); location.hash = ''; },
  recarregar() { if (auth.currentUser) iniciar(auth.currentUser); else Store.set({ fase:'login' }); },
  async reenviar() {
    try { await auth.currentUser.sendEmailVerification(); aviso('E-mail reenviado. Pode demorar um minuto.', 'ok'); }
    catch (e) { aviso(msgErro(e)); }
  },
  async jaVerifiquei() {
    try {
      await auth.currentUser.reload();
      await auth.currentUser.getIdToken(true);
      if (!auth.currentUser.emailVerified) return aviso('Ainda não apareceu como confirmado. Clique no link do e-mail primeiro.');
      await iniciar(auth.currentUser);
    } catch (e) { aviso(msgErro(e)); }
  },
  async convite(el) {
    el.disabled = true;
    const box = $('#conviteBox');
    try {
      const id = novoId();
      const exp = Date.now() + 7 * 864e5;
      await db.doc('convites/' + id).set({ empresaId:EMPRESA, expiraEmMs:exp, criadoPorUid:Store.s.user.uid, usadoPorUid:null });
      const link = location.origin + location.pathname + '?convite=' + id;
      box.innerHTML = `<div class="alert ok on" style="margin-bottom:8px">Convite criado. Vale até ${new Date(exp).toLocaleDateString('pt-BR')} e só funciona uma vez.</div>
        <div class="copy"><input readonly value="${esc(link)}" id="linkConvite"><button class="btn" data-act="copiar" data-alvo="linkConvite">Copiar</button></div>`;
    } catch (e) { box.innerHTML = `<div class="alert err on">${esc(msgErro(e))}</div>`; }
    el.disabled = false;
  },
  async copiar(el) {
    const i = document.getElementById(el.dataset.alvo); if (!i) return;
    try { await navigator.clipboard.writeText(i.value); el.textContent = 'Copiado'; }
    catch (_) { i.select(); el.textContent = 'Selecione e copie'; }
  },
  async rodar(el) {
    const s = Store.s, out = $('#diagOut');
    el.disabled = true; el.textContent = 'Rodando…';
    out.innerHTML = '<div class="pb"><div class="skel" style="width:50%"></div></div>';
    const res = await rodarTestes(suiteDeTestes(s.perfil, s.user));
    const ok = res.filter(r => r.ok).length;
    const tag = r => r.ok ? '<span class="badge ok">ok</span>' : '<span class="badge err">falhou</span>';
    out.innerHTML = `<div class="pb" style="border-bottom:1px solid var(--b1)"><span class="badge ${ok === res.length ? 'ok' : 'err'}">${ok} de ${res.length} corretos</span>
      <span class="muted" style="font-size:13px;margin-left:8px">${esc(s.user.email)} · ${s.perfil.papel}</span></div>
      <table><thead><tr><th>Teste</th><th>Esperado</th><th>Resultado</th><th></th></tr></thead><tbody>${res.map(r =>
        `<tr><td>${esc(r.nome)}</td><td>${r.esperado === 'permitir' ? 'Permitir' : 'Negar'}</td><td class="mono">${esc(r.obtido)}</td><td>${tag(r)}</td></tr>`).join('')}</tbody></table>`;
    window.__diag = res;
    el.disabled = false; el.textContent = 'Rodar de novo';
  }
};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a && acoes[a.dataset.act]) { e.preventDefault(); acoes[a.dataset.act](a, e); }
});
document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(f).entries());
  const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
  try {
    if (f.dataset.form === 'entrar') await entrar(d.email || '', d.senha || '');
    else await criarConta({ nome:d.nome || '', email:d.email || '', senha:d.senha || '', convite:d.convite || '' });
  } catch (err) { aviso(msgErro(err)); btn.disabled = false; }
});

/* ============ service worker (offline do "esqueleto") ============ */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
