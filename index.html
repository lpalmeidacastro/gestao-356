<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<script>
/* tema: roda antes da pintura para não piscar */
(function(){var m='auto';try{m=localStorage.getItem('g356-tema')||'auto'}catch(e){}
var c=m==='claro'||(m==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches);
document.documentElement.setAttribute('data-tema',c?'claro':'escuro');
var t=document.querySelector('meta[name=theme-color]');if(t)t.setAttribute('content',c?'#f4eee2':'#0a0a0c');})();
</script>
<meta name="robots" content="noindex, nofollow">
<title>Gestão 356</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
/* modo "Lançar" (?lancar=1): ícone próprio na tela inicial que abre direto no Novo lançamento.
   Troca manifesto, ícone e nome antes de o iPhone ler, para virar um segundo ícone separado do app. */
(function(){if(!/[?&]lancar\b/.test(location.search))return;
var q=function(s){return document.querySelector(s)};
q('link[rel=manifest]').href='manifest-lancar.json';
q('link[rel=apple-touch-icon]').href='icon-lancar-180.png';
q('link[rel=icon]').href='icon-lancar-192.png';
document.title='Lançar · 356';
var m=document.createElement('meta');m.name='apple-mobile-web-app-title';m.content='Lançar';document.head.appendChild(m);})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&family=Russo+One&display=swap" media="print" onload="this.media='all'">
<style>
/* ===== tokens · marca 356 · escuro ===== */
:root{
  --bg:#0a0a0c; --side:#0d0d11; --card:#131318; --card2:#0f0f14; --hover:#1b1b23; --track:#24242c;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.1);
  --t1:#f6f6f8; --t2:#c4c6d0; --t3:#9a9caa; --t4:#8a8c99;
  --roxo:#7b2ff7; --magenta:#b414c9; --verm:#f0164a; --lar:#ff8a1f;
  --grad:linear-gradient(120deg,#7b2ff7 0%,#b414c9 38%,#f0164a 70%,#ff8a1f 100%);
  --grad-btn:linear-gradient(120deg,#7b2ff7 0%,#b414c9 60%,#d4155a 100%);
  --grad-hero:linear-gradient(135deg,#5b1fc4 0%,#9a12b0 45%,#c8133f 100%);
  --nav-on:linear-gradient(90deg,rgba(123,47,247,.22),rgba(240,22,74,.08));
  --link:#c7a6ff; --foco:#c7a6ff;
  --ok:#3ecf8e; --warn:#ffb547; --lar:#ff9a3d; --amar:#f2d94e; --err:#ff5c7a;
  --titulo:'Russo One',Inter,system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  --w1:rgba(255,255,255,.02); --w2:rgba(255,255,255,.05); --btnbg:#16161c; --pur:#b98cff; --errt:#ff8fa3; --navoff2:#a3a5b2; --mask:rgba(0,0,0,.6); --navoff:#a3a5b2;
  --s1:#a47bff; --s2:#ffa94d; --s3:#3cc9b4; --s4:#ec4fb0; --s5:#5aa9ff; --s6:#d4c15a; --s7:#ff5d6c; --s0:#80828f;
  --okbg:rgba(62,207,142,.12); --sombra:none; color-scheme:dark;
}
:root[data-tema=claro]{
  --bg:#f4eee2; --side:#efe7d8; --card:#fbf8f1; --card2:#f7f2e7; --hover:#ede5d5; --track:#e2d9c7;
  --line:rgba(45,35,20,.12); --line2:rgba(45,35,20,.2);
  --t1:#1c1814; --t2:#3d362e; --t3:#5f574c; --t4:#6f665a;
  --link:#6420d4; --foco:#6420d4; --ok:#0f7a4d; --warn:#955400; --lar:#b45309; --amar:#8a6d00; --err:#c11340;
  --pur:#6420d4; --errt:#c11340; --w1:rgba(45,35,20,.04); --w2:rgba(45,35,20,.07); --btnbg:#fbf8f1; --mask:rgba(28,24,20,.45); --navoff:#3d362e;
  --s1:#6a35d9; --s2:#c2650a; --s3:#0e8577; --s4:#b3127a; --s5:#1f6fd1; --s6:#857410; --s7:#d4153f; --s0:#8a8378;
  --nav-on:linear-gradient(90deg,rgba(123,47,247,.16),rgba(240,22,74,.07));
  --sombra:0 1px 2px rgba(60,40,10,.08); color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--t2);font:400 15px/1.5 Inter,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{color:var(--t1);font-weight:590;text-wrap:balance}
p{text-wrap:pretty}
a{color:var(--link)}
.mono{font-family:var(--mono)}
.muted{color:var(--t3)}
.hide{display:none!important}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--foco);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* logo da marca (imagem enviada pelo dono: 356 + GESTÃO) */
.logo-img{display:block;height:auto;width:112px}
.logo-img.lg{width:140px}
.logo-img.sm{width:56px}
.logo-img.lg-cla{display:none}
:root[data-tema=claro] .logo-img.lg-cla{display:block}
:root[data-tema=claro] .logo-img.lg-esc{display:none}
@media print{.logo-img.lg-cla{display:block!important}.logo-img.lg-esc{display:none!important}}
/* seletor de aparência */
.tema{display:flex;gap:3px;padding:3px;border-radius:10px;background:var(--w2);border:1px solid var(--line)}
.tema button{flex:1;min-height:40px;border:0;border-radius:8px;background:transparent;color:var(--t2);font-size:13px;font-weight:510;cursor:pointer}
.tema button:hover{background:var(--w1)}
.tema button[aria-pressed=true]{background:var(--card);color:var(--t1);font-weight:590;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.temabox{padding:16px 12px 0;display:flex;flex-direction:column;gap:8px}
.temabox>span{font-size:12px;color:var(--t3)}
.avisos{display:flex;flex-direction:column;gap:8px;padding:12px 12px 0}
.avisos p{font-size:12px;color:var(--t3);line-height:1.4}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);background:var(--btnbg);color:var(--t1);font-weight:510;font-size:14px;cursor:pointer;transition:filter .2s var(--ease),transform .2s var(--ease),background-color .2s var(--ease)}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--grad-btn);border-color:transparent;color:#fff;font-weight:590}
.btn.pri:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--t2)}
.btn.ghost:hover{background:var(--w2)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;filter:none}
.btn.full{width:100%}

/* campos */
label.f{display:block;margin-bottom:16px}
label.f>span{display:block;font-size:13px;color:var(--t3);margin-bottom:8px;font-weight:510}
input,select{width:100%;height:44px;padding:0 12px;background:var(--card2);border:1px solid var(--line2);border-radius:10px;color:var(--t1)}
input:focus,select:focus{border-color:var(--foco)}
input::placeholder{color:var(--t4)}
input[type=checkbox]{width:20px;height:20px;padding:0;flex:0 0 auto;accent-color:var(--link);cursor:pointer}
.tiposck{display:flex;flex-wrap:wrap;gap:8px}
.tiposck label{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:1px solid var(--line2);border-radius:10px;background:var(--card2);font-size:14px;cursor:pointer}
.pitem{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 44px;gap:8px;align-items:end;padding:12px 0;border-top:1px solid var(--line)}
.pitem .f{margin-bottom:0}.pitem .pi-prod,.pitem .pi-nome{grid-column:1/-1}
.pi-t{display:flex;flex-direction:column;justify-content:center;min-height:44px;font-size:12px;color:var(--t3)}
.pi-t b{font-size:15px;font-weight:590;color:var(--t1);font-variant-numeric:tabular-nums}
.pedtot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--line2);border-radius:10px;background:var(--card2);margin-bottom:16px;font-size:14px}
.pedtot b{font-size:18px;font-weight:590;color:var(--t1);font-variant-numeric:tabular-nums}
.conf{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.conf .f{margin-bottom:0}
.ckl{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-size:14px;color:var(--t2)}
.ckl input[type=checkbox]{width:22px;height:22px}
.ckl b{color:var(--t1);font-weight:510}
.lgrupo{padding:10px 20px;font-size:12px;font-weight:590;letter-spacing:.02em;color:var(--t2);background:var(--w1);border-top:1px solid var(--line)}
.dhr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fset{border:0;padding:0;margin:0 0 12px}.fset legend{font-size:13px;font-weight:510;color:var(--t2);margin-bottom:2px}
.ckl input[type=radio]{width:20px;height:20px;flex:0 0 auto;accent-color:var(--link)}
.bdif{display:block;font-size:12px;color:var(--t3);font-weight:400;line-height:1.4}
@media (max-width:700px){.bdif{max-width:120px;margin-left:auto;text-align:right}}
@media (max-width:700px){.pitem{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px}.pi-t{grid-column:1/3}.conf{grid-template-columns:minmax(0,1fr) 96px}}
.hint{font-size:12px;color:var(--t4);margin-top:8px}

/* aviso */
.alert{display:none;padding:12px;border-radius:10px;font-size:13px;margin-bottom:16px;border:1px solid var(--line2);background:var(--card2)}
.alert.on{display:block}
.alert.err{border-color:rgba(255,92,122,.3);background:rgba(255,92,122,.1);color:var(--errt)}
.alert.ok{border-color:rgba(62,207,142,.3);background:rgba(62,207,142,.08);color:var(--ok)}

/* telas cheias: login, verificar, sem acesso */
.center{min-height:100dvh;display:grid;place-items:center;padding:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px;width:100%;max-width:400px}
.brand{display:block;margin-bottom:24px}
.card h1{font-size:20px;letter-spacing:-.24px;margin-bottom:8px}
.card .sub{font-size:14px;color:var(--t3);margin-bottom:24px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;margin-bottom:24px}
.tabs button{height:36px;border:0;border-radius:8px;background:transparent;color:var(--t3);font-weight:510;font-size:13px;cursor:pointer;transition:background-color .2s var(--ease)}
.tabs button.on{background:var(--track);color:var(--t1)}
.links{display:flex;justify-content:space-between;margin-top:16px;font-size:13px}
/* modo Lançar (ícone próprio) */
.rap{min-height:100dvh;display:flex;justify-content:center;align-items:flex-start;padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.rap .card{max-width:480px;padding:24px}
.rap .brand{margin-bottom:16px}.rap .logo-img.lg{width:96px}
.rap .acoes{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.rap .rodape{display:flex;justify-content:center;margin-top:16px;font-size:13px}
.rap .feito{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:8px 0 16px}
.rap .feito .bola{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--okbg);color:var(--ok)}
.rap .feito .bola .i{width:32px;height:32px;stroke-width:2.5}
.rap .feito .v{font-family:var(--titulo);font-size:32px;color:var(--t1)}
@media (max-width:760px){.rap{padding-left:8px;padding-right:8px}.rap .card{padding:20px 16px}}
.links button{background:none;border:0;color:var(--link);cursor:pointer;font-size:13px;min-height:44px}


.chips{display:flex;gap:8px;flex-wrap:wrap}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}
.printonly{display:none}
@media (max-width:900px){.duo{grid-template-columns:minmax(0,1fr);gap:24px}}

/* estrutura do app */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;overflow:auto;background:var(--side);border-right:1px solid var(--line);padding:24px 12px;display:flex;flex-direction:column;gap:4px}
.side .brand{padding:4px 12px 20px;margin:0;text-decoration:none}
.grp{font-size:11px;font-weight:590;letter-spacing:.6px;text-transform:uppercase;color:var(--t4);padding:16px 12px 6px}
.grp:first-of-type{padding-top:12px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;min-height:40px;padding:0 12px;border-radius:10px;color:var(--navoff);text-decoration:none;font-size:14px;font-weight:510;transition:background-color .2s var(--ease),color .2s var(--ease)}
.nav a:hover{background:var(--w2);color:var(--t1)}
.nav a.on{background:var(--nav-on);color:var(--t1)}
.nav a.on svg{color:var(--link)}
.me{margin-top:auto;border-top:1px solid var(--line);padding:16px 12px 0;display:flex;align-items:center;gap:12px}
.av{width:36px;height:36px;flex:none;border-radius:50%;background:linear-gradient(135deg,#7b2ff7,#f0164a,#ff8a1f);display:grid;place-items:center;color:#fff;font-weight:590;font-size:13px;border:0;text-decoration:none}
.me .nm{display:flex;flex-direction:column;min-width:0}
.me .nm b{color:var(--t1);font-size:14px;font-weight:510;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .nm span{font-size:12px;color:var(--t3)}
.me .btn{margin-left:auto;width:44px;padding:0}
.main{min-width:0}
.offline .lk{background:none;border:0;color:inherit;font:inherit;font-weight:590;text-decoration:underline;cursor:pointer;padding:0 0 0 6px;min-height:0}
.offline{background:rgba(255,181,71,.1);border-bottom:1px solid rgba(255,181,71,.3);color:var(--warn);font-size:13px;padding:8px 40px}
.wrap{max-width:1240px;padding:32px 40px 48px}
.mhead,.tabbar{display:none}
.srch{display:flex;align-items:center;gap:12px;width:100%;min-height:40px;padding:0 12px;margin:0 0 12px;border-radius:10px;border:1px solid var(--line);background:var(--w2);color:var(--t2);font:inherit;font-size:14px;font-weight:510;cursor:pointer;text-align:left}
.srch:hover{color:var(--t1)}.srch span{flex:1}.srch kbd{font:inherit;font-size:11px;color:var(--t3);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.mh2{display:flex;align-items:center;gap:8px}.mh2 .sbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--w2);color:var(--t1);cursor:pointer}
.busca h3{font-size:12px;font-weight:590;color:var(--t3);margin:16px 0 4px;letter-spacing:.02em}
.busca .bi{display:flex;width:100%;justify-content:space-between;gap:12px;align-items:center;text-align:left;padding:10px 8px;min-height:44px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--t1);font:inherit;cursor:pointer}
.busca .bi:hover,.busca .bi:focus-visible{background:var(--w2)}
.busca .bi b{display:block;font-weight:510;font-size:14px;overflow-wrap:anywhere}
.busca .bi small{display:block;color:var(--t3);font-size:12px;margin-top:2px;overflow-wrap:anywhere}
.busca .bi .bv{white-space:nowrap;font-variant-numeric:tabular-nums;font-size:14px}

/* cabeçalho de página */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:32px}
.ph .ctx{font-size:13px;color:var(--t3);font-weight:510}
.ph h1{font-family:var(--titulo);font-weight:400;font-size:32px;letter-spacing:-.4px;margin-top:4px}
.ph p{font-size:14px;color:var(--t3);max-width:60ch;margin-top:8px}
.greet{display:none}
.mes{display:flex;align-items:center;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.mes button{width:44px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--t2);cursor:pointer;display:grid;place-items:center;transition:background-color .2s var(--ease)}
.mes button:hover:not([disabled]){background:var(--hover)}
.mes button[disabled]{opacity:.35;cursor:not-allowed}
.mes span{min-width:96px;text-align:center;font-size:14px;font-weight:510;color:var(--t1)}

/* blocos do painel */
.stack{display:flex;flex-direction:column;gap:32px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.hov{transition:background-color .22s var(--ease),transform .22s var(--ease),border-color .22s var(--ease);text-decoration:none;color:inherit}
.hov:hover{background:var(--hover);transform:translateY(-2px);border-color:rgba(185,140,255,.35)}
.kpi{display:flex;flex-direction:column;gap:12px}
.kpi .top{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--t3);font-weight:510}
.kpi .val{font-family:var(--titulo);font-size:28px;letter-spacing:-.4px;color:var(--t1);overflow-wrap:anywhere}
.kpi .sub{font-size:12px;color:var(--t3)}
.dl{font-size:12px;font-weight:590}
.dl.up{color:var(--ok)} .dl.dn{color:var(--warn)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:16px}
.sec-h h2{font-size:18px}
.sec-h a{font-size:13px;font-weight:510;text-decoration:none}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.acts{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.setc{display:flex;flex-direction:column;gap:16px}
.setc .t{display:flex;align-items:center;justify-content:space-between;gap:8px}
.setc .t b{font-weight:590;color:var(--t1)}
.setc .t span{font-size:12px;color:var(--t3)}
.setc .v{font-family:var(--titulo);font-size:24px;letter-spacing:-.3px;color:var(--t1)}
.setc .l{font-size:12px;color:var(--t3)}
.meta{display:flex;flex-direction:column;gap:8px}
.meta .r{display:flex;justify-content:space-between;font-size:12px;color:var(--t3)}
.meta .r b{color:var(--t1);font-weight:510}
.trk{height:6px;border-radius:9999px;background:var(--track);overflow:hidden}
.trk div{height:100%;border-radius:9999px;background:var(--grad)}
.two>.vazio-mini{align-self:start}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:16px}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:16px}
.box h2{font-size:16px}
.box .bh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.seg{display:flex;gap:4px;padding:4px;background:var(--bg);border-radius:10px;border:1px solid var(--line)}
.seg button{height:36px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--t3);font-size:13px;font-weight:510;cursor:pointer;transition:background-color .2s var(--ease)}
.seg button.on{background:var(--track);color:var(--t1)}
.bars{height:220px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:end}
.bars .c{display:flex;flex-direction:column;gap:8px;height:100%;justify-content:flex-end}
.bars .c .n{font-size:12px;color:var(--t1);text-align:center;font-weight:510}
.bars .c .b{width:100%;border-radius:10px 10px 4px 4px;background:var(--grad);min-height:8px;transform-origin:bottom;animation:sobe .45s var(--ease) both}
.bars .c .b.z{background:var(--track,var(--line2));animation:none}
.bars .c .s{font-size:12px;color:var(--t3);text-align:center}
@keyframes sobe{from{transform:scaleY(.2);opacity:0}to{transform:none;opacity:1}}
.mini{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px}
.vazio-mini{display:flex;flex-direction:column;gap:12px}

    if (adm && !u.emailVerified) { Store.set({ user:u, perfil:null, fase:'verificar' }); return; }

      await b.commit();

async function rodarTestes(suite) {
  const out = [];
  for (const t of suite) {
    let got;
    try { await t.fn(); got = 'permitir'; }
    catch (e) { got = e && e.code === 'permission-denied' ? 'negar' : 'erro:' + ((e && e.code) || (e && e.message) || '?'); }
    out.push({ nome:t.nome, esperado:t.esperado, obtido:got, ok:got === t.esperado });
  }
  return out;
}

/* ============ dados do painel (lê o que os próximos blocos vão gravar) ============ */
// Formato combinado: lancamentos {tipo:'venda'|'custo', setor, valor:número, data:'AAAA-MM-DD'}
//                    metas/{setor_AAAA-MM} {vendas}   energia/{AAAA-MM_loja} {mes, loja, consumo, injetado, semDesconto, pagoUsina, pagoEnel}
function somar(docs) {
  const t = { vendas:0, custos:0, n:0, set:{}, sem:{ vendas:[0,0,0,0], custos:[0,0,0,0] } };
  docs.forEach(d => {
    const x = d.data();
    const k = x.tipo === 'custo' ? 'custos' : null;
    if (!k) return;
    const v = Number(x.valor) || 0;
    t[k] += v; t.n++;
    const s = t.set[x.setor] || (t.set[x.setor] = { vendas:0, custos:0 });
    s[k] += v;
    const dia = parseInt(String(x.data).slice(8, 10), 10) || 1;
    t.sem[k][Math.min(3, Math.floor((dia - 1) / 7))] += v;
  });
  return t;
}
async function buscarPainel(mes) {
  const ref = db.collection(`empresas/${EMPRESA}/lancamentos`);
  const faixa = m => ref.where('data', '>=', m + '-01').where('data', '<', mesAdd(m, 1) + '-01').get();
  const [a, b, mt, en, va, vb] = await Promise.all([
    faixa(mes), faixa(mesAdd(mes, -1)),
    db.collection(`empresas/${EMPRESA}/metas`).get(),
    db.collection(`empresas/${EMPRESA}/energia`).where('mes', '==', mes).get(),
    colVendasMes().doc(mes).get(), colVendasMes().doc(mesAdd(mes, -1)).get()
  ]);
  const metas = {};
  mt.docs.forEach(d => { if (d.id.endsWith('_' + mes)) metas[d.id.slice(0, -(mes.length + 1))] = Number(d.data().vendas) || 0; });
  const atual = somar(a.docs), anterior = somar(b.docs);
  atual.vendas = va.exists ? Number(va.data().valor) || 0 : 0; anterior.vendas = vb.exists ? Number(vb.data().valor) || 0 : 0;
  return { atual, anterior, metas, energia:en.docs.length ? somaEn(en.docs.map(d => d.data())) : null };
}

        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        out = c.toDataURL('image/jpeg', q);

}

function recalcPed(f) {
  let soma = 0;
  f.querySelectorAll('[data-item]').forEach(L => {
    const q = parseValor(L.querySelector('[data-k=qtd]').value), pt = L.querySelector('[data-k=preco]').value.trim(), pr = parseValor(pt);
    const ok = q > 0 && pt !== '' && pr >= 0, t = ok ? r2(q * pr) : 0; soma += t;

}
function lerItensPed(f, fid, velho, attPreco) {
  const prods = prodsDe(fid), itens = [], novos = [], att = [];
  const linhas = Array.from(f.querySelectorAll('[data-item]'));
  for (let i = 0; i < linhas.length; i++) {
    const L = linhas[i], g = k => L.querySelector(`[data-k=${k}]`), n = i + 1;
    const sel = g('prod').value, qtxt = g('qtd').value.trim(), ptxt = g('preco').value.trim();
    if (!sel && !qtxt && !ptxt) continue;
    let nome, prodId = null;
    if (!sel) return { erro:`Escolha o produto da linha ${n}.` };
    if (sel === '__novo') {
      nome = g('nome').value.trim();
      if (nome.length < 2) return { erro:`Digite o nome do produto novo da linha ${n}.` };
      if (prods.some(p => nomeIgual(p.nome, nome)) || novos.some(x => nomeIgual(x.nome, nome))) return { erro:`O produto "${nome}" já está cadastrado. Escolha ele na lista.` };
    } else if (sel === '__livre') { nome = L.dataset.nome || ''; prodId = L.dataset.pid || null; }
    else { const p = prods.find(x => x.id === sel); if (!p) return { erro:`Escolha o produto da linha ${n} de novo.` }; nome = p.nome; prodId = p.id; }
    const qtd = parseValor(qtxt), preco = parseValor(ptxt);
    if (!(qtd > 0)) return { erro:`Digite a quantidade de ${nome} (linha ${n}).` };
    if (!ptxt || !(preco >= 0)) return { erro:`Digite o preço de ${nome} (linha ${n}). Exemplo: 12,50` };
    const ant = velho && L.dataset.ix != null ? (velho.itens || [])[Number(L.dataset.ix)] : null, mesmo = !!ant && ant.nome === nome;
    if (sel === '__novo') novos.push({ i:itens.length, nome, preco });
    else if (prodId && attPreco) { const p = prods.find(x => x.id === prodId); if (p && Number(p.preco) !== preco) att.push({ id:prodId, preco }); }
    itens.push({ prodId, nome, qtd, preco, total:r2(qtd * preco), recebido:mesmo ? !!ant.recebido : false, qtdRecebida:mesmo && ant.qtdRecebida != null ? ant.qtdRecebida : null });
  }
  if (!itens.length) return { erro:'Escolha pelo menos um produto para o pedido.' };
  return { itens, novos, att };
}

    }

    if (anx.length) mud.nAnexos = anx.length;

    else {
      const b = db.batch(); b.set(ref, { ...mud, criadoPorUid:Store.s.user.uid, criadoEm:TS() });
      anx.forEach((a, k) => b.set(colPesAnx().doc(), { ...a, movId:ref.id, ord:Date.now() + k, em:TS(), por:Store.s.user.uid }));
      await b.commit();

    if (data.slice(0, 7) === P.mes) lista = lista.concat([{ ...(velhoP || {}), ...mud, id:ref.id, criadoEm:velhoP ? (velhoP.criadoEm || null) : null }]);
    fecharModal();

}
async function prepArquivos(files, max, soImg) {
  files = Array.from(files || []);
  if (files.length > max) throw new Error(max === 1 ? 'Escolha só uma foto da nota.' : `Escolha no máximo ${max} arquivos.`);
  const out = [];
  for (const file of files) {
    const ehPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
    if (ehPdf && !soImg) {
      const dataUrl = await lerDataUrl(file);
      if (dataUrl.length > MAX_ANX_CHARS) throw new Error(`O PDF "${file.name}" é grande demais (máximo 650 KB). Tente um arquivo menor ou tire uma foto.`);
      out.push({ nome:(file.name || 'arquivo.pdf').slice(0, 80), tipo:'pdf', dataUrl });
    } else if (/^image\//.test(file.type)) out.push({ nome:(file.name || 'foto.jpg').slice(0, 80), tipo:'img', dataUrl:await comprimir(file) });
    else throw new Error(soImg ? 'A nota precisa ser uma foto (JPG ou PNG).' : 'Use fotos (JPG ou PNG) ou PDF.');
  }
  return out;
}

async function enviarAnexoPes(file) {
  const movId = pesAnxAlvo; if (!movId || !file) return;
  if (pesAnxLista.length >= MAX_ANX) return pesAnxErro(`Limite de ${MAX_ANX} anexos por lançamento. Remova um para adicionar outro.`);
  try {
    let tipo, dataUrl;
    if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
      tipo = 'pdf'; dataUrl = await lerDataUrl(file);
      if (dataUrl.length > MAX_ANX_CHARS) return pesAnxErro('Esse PDF é grande demais (máximo 650 KB). Tente um arquivo menor ou tire uma foto.');
    } else if (/^image\//.test(file.type)) { tipo = 'img'; dataUrl = await comprimir(file); }
    else return pesAnxErro('Use uma foto (JPG ou PNG) ou um PDF.');
    const ref = colPesAnx().doc(), reg = { movId, nome:(file.name || (tipo === 'pdf' ? 'arquivo.pdf' : 'foto.jpg')).slice(0, 80), tipo, dataUrl, ord:Date.now(), em:TS(), por:Store.s.user.uid };
    const b = db.batch(); b.set(ref, reg); b.update(colPes().doc(movId), { nAnexos:pesAnxLista.length + 1 }); await b.commit();
    pesAnxLista = pesAnxLista.concat([{ ...reg, id:ref.id }]); pesAnxAtualiza(movId, pesAnxLista.length);
  } catch (e) { pesAnxErro(msgErro(e)); }
}

/* ----- painel ----- */
function delta(a, b) {
  if (!(b > 0)) return '';
  const d = a / b - 1;
  return `<span class="dl ${d >= 0 ? 'up' : 'dn'}">${d >= 0 ? '+' : '−'}${pct(Math.abs(d))}</span>`;
}
function painelHTML(s, nomeCurto) {
  const p = s.painel, d = p.dados;
  const mesLabel = mesNome(p.mes, true), mesCurto = mesNome(p.mes, false);
  const podeAvancar = p.mes < mesAtual();
  const head = `
  <div class="ph">
    <div>
      <div class="greet">${saudacao()}, ${esc(nomeCurto.split(' ')[0])} · ${esc(mesLabel.split(' ')[0].toLowerCase())}</div>
      <div class="ctx">${esc(mesLabel)} · todos os setores</div>
      <h1>Painel geral</h1>
    </div>
    <div class="acts">
    <div class="mes" role="group" aria-label="Mês">
      <button data-act="mes" data-d="-1" aria-label="Mês anterior">${ico('esq')}</button>
      <span aria-live="polite">${esc(mesCurto)}</span>
      <button data-act="mes" data-d="1" aria-label="Próximo mês" ${podeAvancar ? '' : 'disabled'}>${ico('dir')}</button>
    </div>
    <button class="btn" data-act="vendaMes" data-mes="${p.mes}">Venda do mês</button><button class="btn pri" data-act="lancNovo">+ Novo lançamento</button></div>
  </div>`;
  if (p.erro) return head + `<div class="alert err on" role="alert">${esc(p.erro)}</div><button class="btn" data-act="recarregarPainel">Tentar de novo</button>`;
  if (!d) return head + `<div class="stack"><div class="kpis"><div class="skbox"></div><div class="skbox"></div><div class="skbox"></div><div class="skbox"></div></div><div class="skbox" style="height:220px"></div></div>`;

  const a = d.atual, b = d.anterior;
  const lucro = a.vendas - a.custos, lucroAnt = b.vendas - b.custos;
  const semDados = a.n === 0 && !(a.vendas > 0);
  const margem = a.vendas > 0 ? pct(lucro / a.vendas) : null;
  const en = d.energia;
  const eco = en ? ecoEn(en) : 0;
  const ecoPct = en ? ecoPctEn(en) : 0;
  const kpi = (cls, label, valor, dl, sub) => `<div class="box kpi hov ${cls}"><div class="top"><span>${label}</span>${dl}</div><div class="val">${valor}</div><div class="sub">${sub}</div></div>`;
  const kpis = [
    kpi('', 'Vendas', brl(a.vendas), delta(a.vendas, b.vendas), a.vendas > 0 ? (b.vendas > 0 ? 'vs. mês anterior (' + brl(b.vendas) + ')' : 'total da loja no mês') : 'registre em "Venda do mês"'),
    kpi('', 'Gastos', brl(a.custos), delta(a.custos, b.custos), a.n === 0 ? 'Sem gastos lançados neste mês' : 'gastos lançados no mês'),
    kpi('hero', 'Lucro', brl(lucro), lucroAnt > 0 && lucro > 0 ? delta(lucro, lucroAnt) : '', margem ? 'margem de ' + margem : 'registre a venda do mês'),
    kpi('solar', 'Economia solar', brl(en ? eco : 0), en ? `<span class="dl up">${pct(ecoPct)}</span>` : '', en ? (Number(en.injetado) || 0).toLocaleString('pt-BR') + ' kWh injetados' : 'Sem dados de energia neste mês')
  ].join('');

  const setCards = SETORES.map(x => {
    const g = (d.atual.set[x.id] || { custos:0 }).custos, ga = (d.anterior.set[x.id] || { custos:0 }).custos;
    const pg = a.custos > 0 ? Math.round(g / a.custos * 100) : 0;
    return `<a class="box hov setc" href="#/${x.id}">
      <div class="t"><b>${esc(x.nome)}</b>${delta(g, ga)}</div>
      <div><div class="v">${brl(g)}</div><div class="l">gasto no mês</div></div>
      <div class="meta"><div class="r"><span>Dos gastos da loja</span><b>${pg}%</b></div>

    </a>`;

  const m = 'custos', serie = a.sem[m], max = Math.max(...serie, 1);
  const tem = serie.some(v => v > 0);
  const grafico = tem
    ? `<div class="bars" role="img" aria-label="Gastos por semana: ${serie.map(brlMil).join('; ')}">${serie.map((v, i) =>

    : `<div class="vazio-mini"><p>Nenhum ${m === 'vendas' ? 'lançamento de venda' : 'custo lançado'} em ${esc(mesLabel.toLowerCase())}. As barras aparecem quando houver lançamentos.</p></div>`;

  const futuro = (titulo, texto) => `<div class="box vazio-mini"><div class="bh" style="margin:0"><h2>${titulo}</h2><span class="badge">Em breve</span></div><p>${texto}</p></div>`;

  return head + `
  <div class="stack">
    <section aria-label="Resumo do mês" class="kpis">${kpis}</section>
    ${metaCard(p.mes, a.vendas)}
    <section aria-label="Setores">
      <div class="sec-h"><h2>Setores</h2></div>
      <div class="sets">${setCards}</div>
    </section>
    <section class="two">
      <div class="box">
        <div class="bh"><h2>Gastos por semana</h2></div>
        ${grafico}
      </div>
      ${boletosCard(s)}
    </section>
    <section class="three">
      ${tarefasCard(s)}
      ${freelancersCard(s)}
      <div class="box vazio-mini"><div class="bh" style="margin:0"><h2>Energia solar</h2><a href="#/energia" style="font-size:13px;font-weight:510;text-decoration:none">Abrir</a></div>${en
        ? `<div><span class="big">${brl(eco)}</span> <span class="muted" style="font-size:13px">economizados no mês</span></div>
           <p>Sem desconto seria <b style="color:var(--t1)">${brl(en.semDesconto)}</b>. Pagando usina e Enel: <b style="color:var(--t1)">${brl(totEn(en))}</b>.</p>
           <div class="eco">${pct(ecoPct)} a menos que sem desconto</div>`
        : '<p>Sem dados de energia em ' + esc(mesLabel.toLowerCase()) + '. A economia com a usina aparece depois do primeiro lançamento do mês.</p>'}</div>
    </section>

}

/* ============ modo Lançar (?lancar=1) ============
   Segundo ícone na tela inicial: abre só o formulário de Novo lançamento (o mesmo do app).
   A tela só redesenha quando muda de etapa (carregando → formulário → lançado), para não apagar o que está sendo digitado. */
const RAPIDO = /[?&]lancar\b/.test(location.search);
let rapEtapa = null, rapUlt = null, rapN = 0;
function rapFeito(valor, onde, setor) {
  rapUlt = { valor, onde, n:++rapN };
  try { localStorage.setItem('g356-ult-setor', setor); } catch (e) {}
}
function rapSetor() {
  let v = ''; try { v = localStorage.getItem('g356-ult-setor') || ''; } catch (e) {}
  return SETORES.some(x => x.id === v) || (v === '__pes' && ehDonoPes()) ? v : undefined;
}
function rapPronto(s) { return s.subset.ok && s.forn.lista !== null && s.catemp.lista !== null && (!ehDonoPes() || !!s.pes.cats); }
function renderRapido(s) {
  if (!s.subset.ok) carregarSubs();
  if (s.forn.lista === null) carregarForn();
  if (s.catemp.lista === null) carregarCatEmp();
  if (ehDonoPes() && !s.pes.cats) carregarPes();
  const etapa = rapUlt ? 'ok' + rapUlt.n : (rapPronto(s) ? 'form' : 'carregando');
  if (etapa === rapEtapa && ultimaFase === 'app') return;
  rapEtapa = etapa;
  $('#root').innerHTML = V.rapido(s, rapUlt ? 'ok' : etapa);
  window.scrollTo(0, 0);
  const sel = $('#root select[name=setor]');
  if (sel && sel.value === '__pes') sel.dispatchEvent(new Event('change', { bubbles:true }));
}
V.rapido = (s, etapa) => {
  const instalado = navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  const dica = instalado ? '' : '<div class="alert on" style="margin-bottom:16px">Para virar um ícone na tela inicial: no Safari toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>.</div>';
  let corpo;
  if (etapa === 'carregando') corpo = '<h1>Novo lançamento</h1><div class="sk" style="width:100%;margin-top:16px"><div class="skel" style="width:60%"></div><div class="skel"></div><div class="skel" style="width:80%"></div></div>';
  else if (etapa === 'ok') corpo = `<div class="feito" role="status"><div class="bola">${ico('check')}</div><h1>Lançado</h1><div class="v">${brl(rapUlt.valor)}</div><p class="muted" style="font-size:14px">em ${esc(rapUlt.onde)}</p></div>
    <div class="acoes"><button class="btn pri full" type="button" data-act="rapOutro">Lançar outro</button></div>`;
  else corpo = `<h1>Novo lançamento</h1><p class="sub" style="margin-bottom:16px">Salva direto no app.</p>${dica}${formLanc(null, rapSetor())}`;
  return `<div id="redeBar">${redeHTML()}</div><div class="rap"><div class="card">${marca()}${corpo}<div class="rodape"><a href="./">Abrir o app completo</a></div></div></div>`;
};

/* ============ cópia completa (baixar no aparelho) ============ */
// Terceira cópia dos dados, nas mãos do dono: um arquivo com TUDO (empresa e, para Luiz/Eliana, o pessoal).
const COLS_EMP = ['subsetores','vendasMes','categorias','fornecedores','produtos','lancamentos','comprovantes','metas','tarefas','energia','boletos','contas','contasPag','freelancers','presencas','pedidos','fornProdutos','lembretes','membros','jornal'];
const COLS_PES = ['movimentos','anexos','categorias','contas','contasPag','lembretes','jornal'];
function paraJSON(v, d = 0) {
  if (v === null || typeof v !== 'object' || d > 20) return v;
  if (typeof v.toDate === 'function') { try { return { __data:v.toDate().toISOString() }; } catch (e) { return null; } }
  if (Array.isArray(v)) return v.map(x => paraJSON(x, d + 1));
  const o = {}; for (const k of Object.keys(v)) o[k] = paraJSON(v[k], d + 1); return o;
}
async function exportarTudo() {
  const docs = {};
  const ler = async c => { const q = await db.collection(c).get(); q.docs.forEach(x => { docs[c + '/' + x.id] = paraJSON(x.data()); }); };
  await comServidor(async () => {
    const e = await db.doc('empresas/' + EMPRESA).get(); if (e.exists) docs['empresas/' + EMPRESA] = paraJSON(e.data());
    for (const c of COLS_EMP) await ler(`empresas/${EMPRESA}/${c}`);
    if (ehDonoPes()) for (const c of COLS_PES) await ler(`pessoal/${EMPRESA}/${c}`);
  });
  return { formato:'g356-copia-v1', app:APP_VERSAO, geradoEm:new Date().toISOString(), por:(Store.s.user && Store.s.user.email) || '', total:Object.keys(docs).length, docs };
}
function copiaBox() {
  if (!ehAdminFixo(Store.s.user)) return '';
  return `<div class="box" style="margin-top:16px"><div class="avisos"><span style="font-size:12px;color:var(--t3)">Cópia de segurança</span>
    <p>O banco faz backup sozinho todo dia de madrugada. Aqui você baixa, quando quiser, um arquivo com <b>todos</b> os dados (com fotos e anexos) para guardar no seu computador ou no iCloud.</p>
    <button class="btn" data-act="baixarCopia">${ico('check')} Baixar cópia completa</button></div></div>`;
}

/* ============ registro de erros (para saber quando algo quebra no aparelho de alguém) ============ */
// Grava só a mensagem técnica do erro, a tela e a versão; nunca valores ou dados lançados.
const Erros = { enviados:0, MAX:20, vistos:new Set() };
function registrarErro(tipo, msg, pilha) {
  try {
    const u = Store.s.user; msg = String(msg || '').slice(0, 300);
    if (!u || !msg || Erros.enviados >= Erros.MAX || Erros.vistos.has(msg)) return;
    Erros.vistos.add(msg); Erros.enviados++;
    db.collection(`empresas/${EMPRESA}/erros`).doc().set({ tipo, msg, pilha:String(pilha || '').slice(0, 1500), rota:Store.s.rota || '', app:APP_VERSAO, nav:(navigator.userAgent || '').slice(0, 120), uid:u.uid, em:TS() }).catch(() => {});
  } catch (e) { /* registrar erro nunca pode quebrar o app */ }
}
window.addEventListener('error', e => registrarErro('erro', e.message, e.error && e.error.stack));
window.addEventListener('unhandledrejection', e => { const r = e.reason || {}; registrarErro('promessa', r.message || r.code || String(r), r.stack); });

/* ============ render ============ */
let modoLogin = 'entrar';
let ultimaFase = null;
function render() {
  const s = Store.s, root = $('#root');
  if (s.fase === 'login') {
    const conv = new URLSearchParams(location.search).get('convite') || '';
    if (conv && ultimaFase !== 'login') modoLogin = 'criar';
    root.innerHTML = V.login(modoLogin, conv);
  }
  else if (s.fase === 'verificar') root.innerHTML = V.verificar(s);
  else if (s.fase === 'semacesso') root.innerHTML = V.semacesso(s);
  else if (s.fase === 'erro') root.innerHTML = V.erro(s);
  else if (s.fase === 'app' && RAPIDO) renderRapido(s);
  else if (s.fase === 'app') {
    const y = window.scrollY;
    root.innerHTML = V.app(s);
    if (ultimaFase === 'app') window.scrollTo(0, y);
    const rotas = rotasDoPerfil(s);
    const id = rotas.some(r => r.id === s.rota) || ROTAS_EXTRAS[s.rota] ? s.rota : 'painel';
    aposPagina(id, s);
    if (!s.subset.ok) carregarSubs();
    if (s.forn.lista === null) carregarForn();
    if (s.catemp.lista === null) carregarCatEmp();
    if (s.boletos.lista === null) carregarBoletos();
    if (s.contas.defs === null) carregarContas(false, 'contas');
    if (s.free.lista === null) carregarFree();
    if (s.tar.lista === null) carregarTar();
    if (id === 'empresa' && s.lanc.tab === 'pedidos' && s.ped.pedidos === null) carregarPedidos();
  }
  ultimaFase = s.fase;
}
Store.on(render);

window.addEventListener('hashchange', () => {

  window.scrollTo(0, 0);

document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(f).entries());
  if (f.dataset.form === 'boleto') { await salvarBoleto(f, d); return; }
  if (f.dataset.form === 'conta') { await salvarConta(f, d); return; }
  if (f.dataset.form === 'contaPag') { await salvarContaPag(f, d); return; }
  if (f.dataset.form === 'freelancer') { await salvarFree(f, d); return; }
  if (f.dataset.form === 'lancamento') { await salvarLanc(f, d); return; }
  if (f.dataset.form === 'subset') { await salvarSubset(f, d); return; }
  if (f.dataset.form === 'subsetRen') { await renomearSubset(f, d); return; }
  if (f.dataset.form === 'forn') { await salvarForn(f, d); return; }
  if (f.dataset.form === 'fornRen') { await renomearForn(f, d); return; }
  if (f.dataset.form === 'fornTipos') { await salvarFornTipos(f); return; }
  if (f.dataset.form === 'produto') { await salvarProd(f, d); return; }
  if (f.dataset.form === 'meta') { await salvarMeta(f, d); return; }
  if (f.dataset.form === 'vendaMes') { await salvarVendaMes(f, d); return; }
  if (f.dataset.form === 'tarefa') { await salvarTar(f, d); return; }
  if (f.dataset.form === 'pedido') { await salvarPedido(f, d); return; }
  if (f.dataset.form === 'lembrete') { await salvarLemb(f, d); return; }
  if (f.dataset.form === 'pedEntrega') { await salvarEntrega(f, d); return; }
  if (f.dataset.form === 'pedPag') { await salvarPagForn(f, d); return; }
  if (f.dataset.form === 'fornProd') { await salvarFornProd(f, d); return; }
  if (f.dataset.form === 'energia') { await salvarEnergia(f, d); return; }
  if (f.dataset.form === 'pessoal') { await salvarPes(f, d); return; }
  if (f.dataset.form === 'pesCat') { await salvarPesCat(f, d); return; }
  const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
  try {
    if (f.dataset.form === 'entrar') await entrar(d.email || '', d.senha || '');
    else await criarConta({ nome:d.nome || '', email:d.email || '', senha:d.senha || '', convite:d.convite || '' });
  } catch (err) { aviso(msgErro(err)); btn.disabled = false; }
});

document.addEventListener('input', e => { const f = e.target.closest && e.target.closest('form[data-form=pedido]'); if (f && e.target.dataset.k) recalcPed(f); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t && t.name === 'pessoal' && t.closest('form[data-form=lembrete]')) { t.closest('form').querySelectorAll('[data-membro]').forEach(m => { const fora = t.checked && !m.dataset.pes; m.classList.toggle('hide', fora); if (fora) m.querySelector('input').checked = false; }); return; }
  if (t && t.id === 'pedForn') { Store.set({ ped:{ ...Store.s.ped, forn:t.value } }); return; }
  const f = t && t.closest ? t.closest('form[data-form=pedido]') : null; if (!f) return;
  if (t.name === 'fornecedorId') { f.querySelector('[data-itens]').innerHTML = itemPedHTML(t.value, null, null); recalcPed(f); return; }
  if (t.dataset.k === 'prod') {
    const L = t.closest('[data-item]'), p = prodsDe(f.querySelector('[name=fornecedorId]').value).find(x => x.id === t.value);
    L.querySelector('.pi-nome').classList.toggle('hide', t.value !== '__novo');
    if (p) L.querySelector('[data-k=preco]').value = dec2(p.preco);
    if (t.value === '__novo') L.querySelector('[data-k=nome]').focus();
    recalcPed(f);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal .md')) fecharModal(); });
document.addEventListener('input', e => {
  const f = e.target.closest && e.target.closest('form[data-form=energia]'); if (!f) return;
  const g = n => parseValor(f.querySelector('[name=' + n + ']').value), sd = g('semDesconto'), pu = g('pagoUsina'), pe = g('pagoEnel');
  const box = f.querySelector('#enPrev'); if (!box) return;
  box.textContent = (sd > 0 && pu >= 0 && pe >= 0) ? prevEnergia({ semDesconto:sd, pagoUsina:pu, pagoEnel:pe }) : 'Total e economia aparecem aqui conforme você digita.';
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t && t.name === 'tipo' && t.closest && t.closest('form[data-form=conta]')) { const f = t.closest('form'); f.querySelectorAll('[data-so]').forEach(x => x.classList.toggle('hide', x.dataset.so !== t.value)); }
});
document.addEventListener('change', e => {
  const t = e.target, f = t && t.closest ? t.closest('form[data-form=lancamento],form[data-form=boleto],form[data-form=conta]') : null;
  if (!f) return;
  if (t.name === 'setor') { const b = f.querySelector('[data-forn]'); if (b) { if (f.dataset.form === 'lancamento') { b.classList.toggle('hide', t.value === '__pes'); const o0 = b.querySelector('select[name=fornecedorId] option[value=""]'); if (o0) o0.textContent = t.value === ID_FORN ? 'Escolha o fornecedor' : 'Sem fornecedor'; const op = b.querySelector('[data-fornopc]'); if (op) op.textContent = t.value === ID_FORN ? '' : '· opcional'; } else b.classList.toggle('hide', t.value !== ID_FORN); } const ds = f.querySelector('[data-desc]'); if (ds) ds.classList.toggle('hide', t.value === ID_FORN); const ce = f.querySelector('[data-catemp]'), cp = f.querySelector('[data-catpes]'); if (ce && cp) { ce.classList.toggle('hide', t.value === '__pes'); cp.classList.toggle('hide', t.value !== '__pes'); } const ae = f.querySelector('[data-anxemp]'), ap = f.querySelector('[data-anxpes]'); if (ae && ap) { ae.classList.toggle('hide', t.value === '__pes'); ap.classList.toggle('hide', t.value !== '__pes'); } }
  if (t.name === 'categoria') { const n = f.querySelector('[data-novacat]'); if (n) n.classList.toggle('hide', t.value !== '__nova'); }
  if (t.name === 'categoriaPes') { const n = f.querySelector('[data-novacatpes]'); if (n) n.classList.toggle('hide', t.value !== '__nova'); }
  if (t.name === 'fornecedorId') { const n = f.querySelector('[data-novoforn]'); if (n) n.classList.toggle('hide', t.value !== '__novo'); }
});
document.addEventListener('change', e => {
  const t = e.target, f = t && t.closest ? t.closest('form[data-form=vendaMes]') : null;
  if (!f || t.name !== 'mes') return;
  const r = (Store.s.vendas.porMes || {})[t.value]; f.querySelector('[name=valor]').value = valorBR(r && r.valor); f.querySelector('[name=obs]').value = r ? r.obs : '';
});
document.addEventListener('change', e => { if (e.target.id === 'arq' && e.target.files[0]) enviarComprovante(e.target.files[0]); });
document.addEventListener('change', e => { const t = e.target; if (t && t.id === 'relTipo') Store.set({ rel:{ ...Store.s.rel, tipo:t.value } }); });
document.addEventListener('change', e => { const t = e.target; if (t && t.name === 'filtroTipo' && t.closest('#modal')) { fornFiltroTipo = t.value; abrirModal('Fornecedores', fornModalHTML()); } });
document.addEventListener('change', e => { if (e.target.id === 'arqPes' && e.target.files[0]) { const f = e.target.files[0]; e.target.value = ''; enviarAnexoPes(f); } });

/* ============ service worker (offline do "esqueleto") ============ */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  const tinhaSW = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!tinhaSW) return; // primeira instalação: nada a fazer
    const el = document.activeElement, ocupado = $('#modal .md') || (el && /INPUT|TEXTAREA|SELECT/.test(el.tagName)) || Rede.pendentes;
    if (performance.now() < 8000 && !ocupado) { location.reload(); return; } // acabou de abrir: troca sozinho
    Rede.novaVersao = true; pintarRede();
  });
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').then(reg => {
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {}));
}
